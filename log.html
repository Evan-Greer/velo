<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELO — Log</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="scrollable-page">

    <header>
        <a href="index.html" class="logo">VELO</a>
        <nav class="tab-nav" id="tabNav"></nav>
        <div class="auth-control" id="authControl"></div>
    </header>

    <main class="page-main" id="pageMain">
        <div class="content-card">
            <p class="signin-prompt">Loading…</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="shared.js"></script>
    <script>
        const PHOTOS_BUCKET = 'journal-photos';

        function todayISO() {
            return veloTodayString();
        }

        function formatEntryDate(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString(undefined, {
                weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
            });
        }

        function escapeHtml(str) {
            return (str || '').replace(/</g, '&lt;');
        }

        async function getSignedUrls(paths) {
            const unique = [...new Set(paths)];
            if (!unique.length) return {};
            const { data, error } = await sb.storage.from(PHOTOS_BUCKET).createSignedUrls(unique, 7200);
            if (error || !data) return {};
            const map = {};
            data.forEach(d => { if (d.signedUrl) map[d.path] = d.signedUrl; });
            return map;
        }

        let currentLogDate = todayISO();

        // Pixels/second the slider crawls at -- tuned to read as a slow,
        // steady drift rather than a snappy carousel, but still moving
        // enough that you're not staring at a still image.
        const LOG_SLIDER_SPEED_PX_PER_SEC = 40;

        async function loadPhotoSlider() {
            const wrap = document.getElementById('logSliderWrap');
            if (!wrap) return;

            const [{ data: photoRows }, { data: entryRows }] = await Promise.all([
                sb.from('journal_photos').select('storage_path, entry_date').order('created_at', { ascending: true }).limit(500),
                sb.from('journal_entries').select('entry_date, thankful_text').limit(1000)
            ]);

            const photos = photoRows || [];
            if (!photos.length) {
                wrap.classList.add('empty');
                wrap.innerHTML = `<p class="log-slider-empty">Photos you add to your log will slide through here.</p>`;
                return;
            }
            wrap.classList.remove('empty');

            const captionByDate = {};
            (entryRows || []).forEach(e => { captionByDate[e.entry_date] = e.thankful_text; });

            const urlMap = await getSignedUrls(photos.map(p => p.storage_path));
            const cards = photos
                .filter(p => urlMap[p.storage_path])
                .map(p => ({ url: urlMap[p.storage_path], caption: captionByDate[p.entry_date] || '' }));

            if (!cards.length) {
                wrap.classList.add('empty');
                wrap.innerHTML = `<p class="log-slider-empty">Photos you add to your log will slide through here.</p>`;
                return;
            }

            // Waiting on <img> load/decode still leaves the browser free to
            // defer the actual paint-ready rasterization of an off-screen
            // image until the moment it scrolls into view -- that's the
            // late pop-in. Pre-rendering each photo to a small, already-
            // fully-decoded thumbnail (via createImageBitmap, which the
            // spec guarantees is fully decoded before it resolves) and
            // using *that* as the <img> src sidesteps the browser's own
            // decode scheduling entirely -- there's nothing left to decode
            // once it's already been painted onto a canvas.
            const THUMB_SIZE = 130;
            async function toDecodedThumbDataUrl(url) {
                const blob = await (await fetch(url)).blob();
                const bitmap = await createImageBitmap(blob);
                const canvas = document.createElement('canvas');
                canvas.width = THUMB_SIZE;
                canvas.height = THUMB_SIZE;
                const ctx = canvas.getContext('2d');
                const cropSize = Math.min(bitmap.width, bitmap.height);
                const sx = (bitmap.width - cropSize) / 2;
                const sy = (bitmap.height - cropSize) / 2;
                ctx.drawImage(bitmap, sx, sy, cropSize, cropSize, 0, 0, THUMB_SIZE, THUMB_SIZE);
                bitmap.close();
                return canvas.toDataURL('image/jpeg', 0.85);
            }

            const thumbUrls = await Promise.all(cards.map(c => toDecodedThumbDataUrl(c.url).catch(() => c.url)));

            const cardHtml = (c, i) => `
                <div class="log-slider-card">
                    <img src="${thumbUrls[i]}">
                    ${c.caption ? `<div class="log-slider-caption">${escapeHtml(c.caption)}</div>` : ''}
                </div>
            `;

            // Duplicated back-to-back so translateX(-50%) loops seamlessly --
            // the second half is a pixel-identical copy of the first, so the
            // loop point is invisible.
            const track = document.getElementById('logSliderTrack');
            track.innerHTML = cards.map(cardHtml).join('') + cards.map(cardHtml).join('');
            track.style.visibility = 'hidden';

            // The thumbnails are already fully decoded bitmaps baked into
            // tiny data URLs, so this should resolve near-instantly -- kept
            // as a final safety net rather than the primary mechanism.
            const imgs = [...track.querySelectorAll('img')];
            await Promise.all(imgs.map(img => img.decode ? img.decode().catch(() => {}) : Promise.resolve()));

            const singleSetWidth = track.scrollWidth / 2;
            track.style.visibility = 'visible';
            startSliderLoop(track, singleSetWidth);
        }

        // A CSS `animation: ... infinite` loop has to jump the transform
        // back from -50% to 0% at the end of every cycle -- harmless in
        // principle since the content is identical there, but some browsers
        // (Safari in particular, especially combined with the mask-image
        // edge fade) visibly hitch right at that keyframe restart, which is
        // exactly the recurring stall at the same spot every loop. Driving
        // the scroll from requestAnimationFrame instead means the position
        // is just elapsed-time-times-speed, wrapped with modulo -- there's
        // no "jump back to start" moment for anything to hitch on, since
        // the underlying number never actually resets.
        let logSliderRafId = null;

        function startSliderLoop(track, singleSetWidth) {
            if (logSliderRafId) cancelAnimationFrame(logSliderRafId);
            if (!singleSetWidth) return;

            // Hover-to-pause used to come free from `animation-play-state:
            // paused` in CSS; now that the scroll is JS-driven, it's
            // reimplemented here by freezing the elapsed-time accumulator
            // rather than the transform directly, so resuming continues
            // smoothly instead of jumping ahead by however long the pause
            // lasted.
            let elapsedAtPause = 0;
            let baseTime = null;
            let paused = false;

            function step(timestamp) {
                if (baseTime === null) baseTime = timestamp;
                if (!paused) {
                    const elapsedSec = elapsedAtPause + (timestamp - baseTime) / 1000;
                    const offset = (elapsedSec * LOG_SLIDER_SPEED_PX_PER_SEC) % singleSetWidth;
                    track.style.transform = `translateX(${-offset}px)`;
                }
                logSliderRafId = requestAnimationFrame(step);
            }

            track.onmouseenter = () => {
                if (paused || baseTime === null) return;
                elapsedAtPause += (performance.now() - baseTime) / 1000;
                paused = true;
            };
            track.onmouseleave = () => {
                if (!paused) return;
                paused = false;
                baseTime = performance.now();
            };

            logSliderRafId = requestAnimationFrame(step);
        }

        function renderSignedOut() {
            const el = document.getElementById('pageMain');
            el.innerHTML = `
                <div class="content-card">
                    <h1>Log</h1>
                    <p class="subtitle">Thankful For</p>
                    <p class="signin-prompt">Connect your Google account (top right) to start your daily journal.</p>
                </div>
            `;
        }

        async function loadPhotosForDate(userId, date) {
            const { data } = await sb.from('journal_photos')
                .select('id, storage_path')
                .eq('entry_date', date)
                .order('created_at', { ascending: true });

            const photos = data || [];
            const urlMap = await getSignedUrls(photos.map(p => p.storage_path));

            document.getElementById('logPhotoRow').innerHTML = photos.map(p => `
                <div class="log-photo-thumb">
                    <img src="${urlMap[p.storage_path] || ''}" alt="">
                    <button type="button" class="log-photo-remove" data-id="${p.id}" data-path="${p.storage_path}" title="Remove">✕</button>
                </div>
            `).join('');
        }

        async function loadHistory() {
            const { data: entries } = await sb
                .from('journal_entries')
                .select('entry_date, thankful_text')
                .order('entry_date', { ascending: false })
                .limit(30);

            const past = (entries || []).filter(e => e.entry_date !== currentLogDate);

            const { data: photoRows } = await sb
                .from('journal_photos')
                .select('entry_date, storage_path')
                .order('created_at', { ascending: true });

            const photosByDate = {};
            (photoRows || []).forEach(p => {
                (photosByDate[p.entry_date] = photosByDate[p.entry_date] || []).push(p.storage_path);
            });

            const urlMap = await getSignedUrls(Object.values(photosByDate).flat());

            document.getElementById('logHistory').innerHTML = past.map(e => `
                <div class="history-entry">
                    <div class="entry-date">${formatEntryDate(e.entry_date)}</div>
                    <div class="entry-text">${escapeHtml(e.thankful_text)}</div>
                    ${(photosByDate[e.entry_date] || []).length ? `
                        <div class="history-photo-row">
                            ${photosByDate[e.entry_date].map(p => urlMap[p] ? `<img src="${urlMap[p]}" class="history-photo-thumb">` : '').join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function renderSignedIn(session) {
            const userId = session.user.id;
            const pageMain = document.getElementById('pageMain');

            currentLogDate = todayISO();

            pageMain.innerHTML = `
                <div class="log-slider-wrap" id="logSliderWrap">
                    <div class="log-slider-track" id="logSliderTrack"></div>
                </div>
                <div class="content-card">
                    <div class="log-date-row">
                        <h1>Log</h1>
                        <input type="date" id="logDateInput" class="log-date-input" max="${todayISO()}" value="${todayISO()}">
                    </div>
                    <p class="subtitle" id="logDateLabel">${formatEntryDate(todayISO())}</p>
                    <textarea class="velo-textarea" id="logTextarea" rows="4" placeholder="What are you thankful for today?"></textarea>

                    <div class="log-photo-row" id="logPhotoRow"></div>
                    <label class="log-photo-upload-btn" for="logPhotoInput">+ Add a Photo</label>
                    <input type="file" accept="image/*" id="logPhotoInput" style="display:none">

                    <div class="save-row">
                        <button class="auth-btn" id="logSaveBtn" type="button">Save</button>
                        <span class="save-status" id="logSaveStatus">Saved</span>
                    </div>
                </div>
                <div class="history-list" id="logHistory"></div>
            `;

            async function loadEntryFormForDate(date) {
                currentLogDate = date;
                const isToday = date === todayISO();

                document.getElementById('logDateLabel').textContent = formatEntryDate(date) + (isToday ? '' : ' · backfilling a past day');
                document.getElementById('logTextarea').placeholder = isToday
                    ? 'What are you thankful for today?'
                    : `What were you thankful for that day?`;
                document.getElementById('logSaveStatus').classList.remove('visible');

                const { data: entry } = await sb
                    .from('journal_entries')
                    .select('thankful_text')
                    .eq('entry_date', date)
                    .maybeSingle();

                document.getElementById('logTextarea').value = entry ? entry.thankful_text : '';

                await loadPhotosForDate(userId, date);
            }

            document.getElementById('logDateInput').onchange = (e) => {
                if (!e.target.value) return;
                loadEntryFormForDate(e.target.value);
            };

            document.getElementById('logSaveBtn').onclick = async () => {
                const text = document.getElementById('logTextarea').value.trim();
                if (!text) return;

                const { error } = await sb.from('journal_entries').upsert({
                    user_id: userId,
                    entry_date: currentLogDate,
                    thankful_text: text
                }, { onConflict: 'user_id,entry_date' });

                if (error) { alert("Couldn't save that entry: " + error.message); return; }

                // Only clears the Log tab's pulse when actually logging today --
                // backfilling a past day doesn't mean today is done.
                if (currentLogDate === todayISO()) {
                    veloMarkDoneToday('velo_log_last_done');
                    renderTabNav('log');
                }

                const status = document.getElementById('logSaveStatus');
                status.classList.add('visible');
                setTimeout(() => status.classList.remove('visible'), 1800);

                loadHistory();
                loadPhotoSlider();
            };

            document.getElementById('logPhotoInput').onchange = async (e) => {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;

                const path = `${userId}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
                const { error: uploadError } = await sb.storage.from(PHOTOS_BUCKET).upload(path, file);
                if (uploadError) { alert("Couldn't upload that photo: " + uploadError.message); return; }

                const { error: insertError } = await sb.from('journal_photos').insert({
                    user_id: userId,
                    entry_date: currentLogDate,
                    storage_path: path
                });
                if (insertError) { alert("Couldn't save that photo: " + insertError.message); return; }

                loadPhotosForDate(userId, currentLogDate);
                loadPhotoSlider();
            };

            document.getElementById('logPhotoRow').onclick = async (e) => {
                const btn = e.target.closest('.log-photo-remove');
                if (!btn) return;
                if (!confirm('Remove this photo?')) return;

                await sb.storage.from(PHOTOS_BUCKET).remove([btn.dataset.path]);
                await sb.from('journal_photos').delete().eq('id', btn.dataset.id);

                loadPhotosForDate(userId, currentLogDate);
                loadPhotoSlider();
            };

            loadPhotosForDate(userId, currentLogDate);
            loadHistory();
            loadPhotoSlider();
        }

        let logRenderedUserId = null;

        async function initLogPage() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                logRenderedUserId = session.user.id;
                renderSignedIn(session);
            } else {
                renderSignedOut();
            }
            // Only rebuild on an actual sign-in/out, not on background token
            // refresh (which fires on tab refocus) -- otherwise this would wipe
            // an in-progress, unsaved entry every time you tabbed away and back.
            sb.auth.onAuthStateChange((_event, newSession) => {
                if (newSession && newSession.user.id !== logRenderedUserId) {
                    logRenderedUserId = newSession.user.id;
                    renderSignedIn(newSession);
                } else if (!newSession && logRenderedUserId !== null) {
                    logRenderedUserId = null;
                    renderSignedOut();
                }
            });
        }

        initVeloNav('log');
        initLogPage();
    </script>
</body>
</html>
