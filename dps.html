<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELO — Daily Prayer & Saint</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .dps-prayer-card {
            text-align: center;
        }

        .dps-prayer-card p {
            font-size: 1.2rem;
            font-style: italic;
            line-height: 1.85;
            color: rgba(255, 255, 255, 0.92);
        }

        .dps-saint-card h1 {
            font-weight: 600;
            font-size: 1.6rem;
            text-transform: none;
            letter-spacing: 0.02em;
            text-align: center;
            color: var(--white);
            margin-bottom: 20px;
        }

        .dps-bio {
            font-size: 1rem;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.85);
            min-height: 1.9em;
        }

        .dps-saint-note {
            text-align: center;
            font-size: 0.78rem;
            font-style: italic;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 18px;
        }

        .dps-saint-portrait {
            display: block;
            width: 148px;
            height: 148px;
            margin: 0 auto 22px auto;
            border-radius: 50%;
            object-fit: cover;
            object-position: top center;
            border: 2px solid rgba(162, 196, 214, 0.35);
            box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.03), 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .dps-saint-portrait-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(162, 196, 214, 0.08);
            color: rgba(162, 196, 214, 0.65);
        }
    </style>
</head>
<body class="scrollable-page">

    <header>
        <a href="index.html" class="logo">VELO</a>
        <nav class="tab-nav" id="tabNav"></nav>
        <div class="auth-control" id="authControl"></div>
    </header>

    <main class="page-main" id="pageMain">
        <div class="content-card">
            <p class="signin-prompt">Loading today's prayer and saint…</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="shared.js"></script>
    <script src="prayers.js"></script>
    <script>
        const DPS_BRAIN_URL = 'https://vgkbefoasgqmainbmvhz.supabase.co/functions/v1/dps-brain';

        function dayOfYear() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            return Math.floor(diff / 86400000);
        }

        function todaysPrayer() {
            return DPS_PRAYERS[dayOfYear() % DPS_PRAYERS.length];
        }

        async function fetchCelebrationForDate(year, month, day) {
            const url = `https://cpbjr.github.io/catholic-readings-api/liturgical-calendar/${year}/${month}-${day}.json`;
            const res = await fetch(url);
            if (!res.ok) return null;
            return res.json();
        }

        // MEMORIAL/OPT_MEMORIAL are always a specific canonized person.
        // FEAST is mixed -- some are saints (Saint Lawrence), some are feasts
        // of the Lord (Transfiguration) -- so those only count if the name
        // actually names a saint. SUNDAY/FERIA/plain SOLEMNITY are season or
        // calendar labels, never a person.
        function isSaintCelebration(celebration) {
            if (!celebration || !celebration.name) return false;
            if (celebration.type === 'MEMORIAL' || celebration.type === 'OPT_MEMORIAL') return true;
            if (celebration.type === 'FEAST' && /\bSaints?\b/.test(celebration.name)) return true;
            return false;
        }

        // The underlying calendar data only covers 2026-2027, and plenty of
        // ordinary weekdays (this one included) have no saint's memorial
        // assigned in either year -- Sundays/solemnities outrank memorials,
        // and some weekdays just never got one. Rather than ever inventing a
        // saint or mislabeling a season name as "today's saint", search
        // outward day by day (checking both available years at each offset)
        // until a real memorial turns up, and say plainly how far off it is.
        async function findNearestSaintCelebration(centerDate) {
            for (let offset = 0; offset <= 10; offset++) {
                const signs = offset === 0 ? [0] : [-1, 1];
                for (const sign of signs) {
                    const d = new Date(centerDate);
                    d.setDate(d.getDate() + offset * sign);
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');

                    for (const year of [centerDate.getFullYear(), centerDate.getFullYear() + 1, centerDate.getFullYear() - 1]) {
                        const data = await fetchCelebrationForDate(year, m, day);
                        if (data && isSaintCelebration(data.celebration)) {
                            return { data, offsetDays: offset * sign };
                        }
                    }
                }
            }
            return null;
        }

        async function fetchTodaysCelebration() {
            const now = new Date();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');

            const todays = await fetchCelebrationForDate(now.getFullYear(), m, d);
            if (isSaintCelebration(todays?.celebration)) {
                return { data: todays, offsetDays: 0 };
            }

            const nearest = await findNearestSaintCelebration(now);
            if (nearest) return nearest;

            if (todays) return { data: todays, offsetDays: 0 };
            throw new Error('calendar fetch failed');
        }

        async function fetchReflection(celebration) {
            try {
                const res = await fetch(DPS_BRAIN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: celebration.name,
                        type: celebration.type,
                        quote: celebration.quote,
                        description: celebration.description
                    })
                });
                const data = await res.json();
                return data.reflection || '';
            } catch (e) {
                return '';
            }
        }

        function buildBioText(celebration, reflection) {
            const parts = [];
            if (celebration.quote) parts.push(`"${celebration.quote}"`);
            if (celebration.description) parts.push(celebration.description);
            if (reflection) parts.push(reflection);
            return parts.join(' ');
        }

        function dpsCacheKey() {
            return 'velo_dps_cache_' + veloTodayString();
        }

        function loadDpsCache() {
            try {
                const raw = localStorage.getItem(dpsCacheKey());
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function saveDpsCache(data) {
            try {
                localStorage.setItem(dpsCacheKey(), JSON.stringify(data));
            } catch (e) {}
        }

        function renderShell(prayer, celebrationName, celebrationImage, nearestNote) {
            const portrait = celebrationImage
                ? `<img class="dps-saint-portrait" src="${celebrationImage}" alt="${celebrationName}">`
                : `<div class="dps-saint-portrait dps-saint-portrait-fallback">
                       <svg viewBox="0 0 100 100" width="60" height="60">
                           <ellipse cx="50" cy="14" rx="22" ry="6" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6"></ellipse>
                           <circle cx="50" cy="32" r="18" fill="none" stroke="currentColor" stroke-width="3"></circle>
                           <path d="M20 85 Q20 55 50 55 Q80 55 80 85" fill="none" stroke="currentColor" stroke-width="3"></path>
                       </svg>
                   </div>`;

            document.getElementById('pageMain').innerHTML = `
                <div class="content-card dps-prayer-card">
                    <p>${prayer.text}</p>
                </div>
                <div class="content-card dps-saint-card">
                    ${portrait}
                    <h1>${celebrationName}</h1>
                    ${nearestNote ? `<p class="dps-saint-note">${nearestNote}</p>` : ''}
                    <p class="dps-bio" id="dpsBio"></p>
                </div>
            `;
        }

        function nearestSaintNote(offsetDays) {
            if (!offsetDays) return '';
            const target = new Date();
            target.setDate(target.getDate() + offsetDays);
            const dateLabel = target.toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
            return `Today has no saint's day of its own on the calendar -- here's the nearest one, usually observed ${dateLabel}.`;
        }

        function typeOutText(el, text) {
            return new Promise((resolve) => {
                const words = text.split(/(\s+)/);
                let i = 0;
                function next() {
                    if (i < words.length) {
                        el.textContent = words.slice(0, i + 1).join('');
                        i++;
                        setTimeout(next, Math.random() * 12 + 6);
                    } else {
                        resolve();
                    }
                }
                next();
            });
        }

        async function initDpsPage() {
            veloMarkDoneToday('velo_dps_last_seen');
            initVeloNav('dps');

            const cached = loadDpsCache();
            if (cached) {
                renderShell(cached.prayer, cached.celebration.name, cached.celebration.image, nearestSaintNote(cached.offsetDays));
                document.getElementById('dpsBio').textContent = buildBioText(cached.celebration, cached.reflection);
                return;
            }

            try {
                const { data, offsetDays } = await fetchTodaysCelebration();
                const celebration = data.celebration;
                const prayer = todaysPrayer();

                renderShell(prayer, celebration.name, celebration.image, nearestSaintNote(offsetDays));

                const reflection = await fetchReflection(celebration);
                await typeOutText(document.getElementById('dpsBio'), buildBioText(celebration, reflection));
                saveDpsCache({ celebration, prayer, reflection, offsetDays });
            } catch (e) {
                document.getElementById('pageMain').innerHTML = `
                    <div class="content-card">
                        <p class="signin-prompt">Couldn't load today's prayer and saint. Try reloading.</p>
                    </div>
                `;
            }
        }

        initDpsPage();
    </script>
</body>
</html>
