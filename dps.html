<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELO — Daily Prayer & Saint</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .dps-prayer-card {
            text-align: center;
        }

        .dps-prayer-card p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-style: italic;
            line-height: 1.85;
            color: rgba(255, 255, 255, 0.92);
        }

        .dps-saint-card h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 1.9rem;
            text-transform: none;
            letter-spacing: 0.02em;
            text-align: center;
            color: var(--white);
            margin-bottom: 20px;
        }

        .dps-bio {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.85);
            min-height: 1.9em;
        }
    </style>
</head>
<body class="scrollable-page">

    <header>
        <a href="index.html" class="logo">VELO</a>
        <nav class="tab-nav" id="tabNav"></nav>
        <div class="auth-control" id="authControl"></div>
    </header>

    <main class="page-main" id="pageMain">
        <div class="content-card">
            <p class="signin-prompt">Loading today's prayer and saint…</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="shared.js"></script>
    <script src="prayers.js"></script>
    <script>
        const DPS_BRAIN_URL = 'https://vgkbefoasgqmainbmvhz.supabase.co/functions/v1/dps-brain';

        function dayOfYear() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            return Math.floor(diff / 86400000);
        }

        function todaysPrayer() {
            return DPS_PRAYERS[dayOfYear() % DPS_PRAYERS.length];
        }

        async function fetchCelebrationForDate(year, month, day) {
            const url = `https://cpbjr.github.io/catholic-readings-api/liturgical-calendar/${year}/${month}-${day}.json`;
            const res = await fetch(url);
            if (!res.ok) return null;
            return res.json();
        }

        async function fetchTodaysCelebration() {
            const now = new Date();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');

            let data = await fetchCelebrationForDate(now.getFullYear(), m, d);

            // Sundays/solemnities outrank saint memorials liturgically, so the
            // API returns just the season name with no saint bio on those days.
            // The saint tied to this calendar date still exists in years where
            // it wasn't superseded -- fall back to find it there.
            if (!data || !data.celebration?.description) {
                const fallback = (await fetchCelebrationForDate(2025, m, d)) || (await fetchCelebrationForDate(2027, m, d));
                if (fallback && fallback.celebration?.description) {
                    data = fallback;
                } else if (!data) {
                    throw new Error('calendar fetch failed');
                }
            }

            return data;
        }

        async function fetchReflection(celebration) {
            try {
                const res = await fetch(DPS_BRAIN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: celebration.name,
                        type: celebration.type,
                        quote: celebration.quote,
                        description: celebration.description
                    })
                });
                const data = await res.json();
                return data.reflection || '';
            } catch (e) {
                return '';
            }
        }

        function buildBioText(celebration, reflection) {
            const parts = [];
            if (celebration.quote) parts.push(`"${celebration.quote}"`);
            if (celebration.description) parts.push(celebration.description);
            if (reflection) parts.push(reflection);
            return parts.join(' ');
        }

        function dpsCacheKey() {
            return 'velo_dps_cache_' + veloTodayString();
        }

        function loadDpsCache() {
            try {
                const raw = localStorage.getItem(dpsCacheKey());
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function saveDpsCache(data) {
            try {
                localStorage.setItem(dpsCacheKey(), JSON.stringify(data));
            } catch (e) {}
        }

        function renderShell(prayer, celebrationName) {
            document.getElementById('pageMain').innerHTML = `
                <div class="content-card dps-prayer-card">
                    <p>${prayer.text}</p>
                </div>
                <div class="content-card dps-saint-card">
                    <h1>${celebrationName}</h1>
                    <p class="dps-bio" id="dpsBio"></p>
                </div>
            `;
        }

        function typeOutText(el, text) {
            return new Promise((resolve) => {
                const words = text.split(/(\s+)/);
                let i = 0;
                function next() {
                    if (i < words.length) {
                        el.textContent = words.slice(0, i + 1).join('');
                        i++;
                        setTimeout(next, Math.random() * 12 + 6);
                    } else {
                        resolve();
                    }
                }
                next();
            });
        }

        async function initDpsPage() {
            veloMarkDoneToday('velo_dps_last_seen');
            initVeloNav('dps');

            const cached = loadDpsCache();
            if (cached) {
                renderShell(cached.prayer, cached.celebration.name);
                document.getElementById('dpsBio').textContent = buildBioText(cached.celebration, cached.reflection);
                return;
            }

            try {
                const data = await fetchTodaysCelebration();
                const celebration = data.celebration;
                const prayer = todaysPrayer();

                renderShell(prayer, celebration.name);

                const reflection = await fetchReflection(celebration);
                await typeOutText(document.getElementById('dpsBio'), buildBioText(celebration, reflection));
                saveDpsCache({ celebration, prayer, reflection });
            } catch (e) {
                document.getElementById('pageMain').innerHTML = `
                    <div class="content-card">
                        <p class="signin-prompt">Couldn't load today's prayer and saint. Try reloading.</p>
                    </div>
                `;
            }
        }

        initDpsPage();
    </script>
</body>
</html>
