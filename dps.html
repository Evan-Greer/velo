<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELO — Daily Prayer & Saint</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .dps-prayer-card {
            text-align: center;
        }

        .dps-prayer-card p {
            font-size: 1.2rem;
            font-style: italic;
            line-height: 1.85;
            color: rgba(255, 255, 255, 0.92);
        }

        .dps-saint-card h1 {
            font-weight: 600;
            font-size: 1.6rem;
            text-transform: none;
            letter-spacing: 0.02em;
            text-align: center;
            color: var(--white);
            margin-bottom: 20px;
        }

        .dps-bio {
            font-size: 1rem;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.85);
            min-height: 1.9em;
        }

        .dps-saint-portrait {
            display: block;
            width: 148px;
            height: 148px;
            margin: 0 auto 22px auto;
            border-radius: 50%;
            object-fit: cover;
            object-position: top center;
            border: 2px solid rgba(162, 196, 214, 0.35);
            box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.03), 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .dps-saint-portrait-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(162, 196, 214, 0.08);
            color: rgba(162, 196, 214, 0.65);
        }
    </style>
</head>
<body class="scrollable-page">

    <header>
        <a href="index.html" class="logo">VELO</a>
        <nav class="tab-nav" id="tabNav"></nav>
        <div class="auth-control" id="authControl"></div>
    </header>

    <main class="page-main" id="pageMain">
        <div class="content-card">
            <p class="signin-prompt">Loading today's prayer and saint…</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="shared.js"></script>
    <script src="prayers.js"></script>
    <script>
        const DPS_BRAIN_URL = 'https://vgkbefoasgqmainbmvhz.supabase.co/functions/v1/dps-brain';

        function dayOfYear() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            return Math.floor(diff / 86400000);
        }

        function todaysPrayer() {
            return DPS_PRAYERS[dayOfYear() % DPS_PRAYERS.length];
        }

        async function fetchCelebrationForDate(year, month, day) {
            const url = `https://cpbjr.github.io/catholic-readings-api/liturgical-calendar/${year}/${month}-${day}.json`;
            const res = await fetch(url);
            if (!res.ok) return null;
            return res.json();
        }

        // MEMORIAL/OPT_MEMORIAL are always a specific canonized person.
        // FEAST is mixed -- some are saints (Saint Lawrence), some are feasts
        // of the Lord (Transfiguration) -- so those only count if the name
        // actually names a saint. SUNDAY/FERIA/plain SOLEMNITY are season or
        // calendar labels, never a person.
        function isSaintCelebration(celebration) {
            if (!celebration || !celebration.name) return false;
            if (celebration.type === 'MEMORIAL' || celebration.type === 'OPT_MEMORIAL') return true;
            if (celebration.type === 'FEAST' && /\bSaints?\b/.test(celebration.name)) return true;
            return false;
        }

        // Pull every real saint's day the calendar data has for a year (not
        // just today's) and rotate through that pool one-per-day, the same
        // way todaysPrayer() rotates through DPS_PRAYERS. This sidesteps
        // liturgical precedence entirely -- no more "today is a Sunday/feria
        // so there's no saint" gaps -- while still only ever showing a real
        // person from the real data source, never an invented one.
        async function buildSaintPool(year) {
            const isLeap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
            const daysInMonth = [31, isLeap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

            const fetches = [];
            for (let month = 1; month <= 12; month++) {
                for (let day = 1; day <= daysInMonth[month - 1]; day++) {
                    const m = String(month).padStart(2, '0');
                    const d = String(day).padStart(2, '0');
                    fetches.push(fetchCelebrationForDate(year, m, d).catch(() => null));
                }
            }

            const results = await Promise.all(fetches);
            return results
                .filter(data => isSaintCelebration(data?.celebration))
                .map(data => data.celebration);
        }

        function dpsSaintPoolKey() {
            return 'velo_dps_saint_pool_v1';
        }

        async function getSaintPool() {
            const year = new Date().getFullYear();
            try {
                const raw = localStorage.getItem(dpsSaintPoolKey());
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed.year === year && parsed.pool && parsed.pool.length) return parsed.pool;
                }
            } catch (e) {}

            let pool = await buildSaintPool(year);
            if (!pool.length) pool = await buildSaintPool(year + 1);

            try {
                localStorage.setItem(dpsSaintPoolKey(), JSON.stringify({ year, pool }));
            } catch (e) {}
            return pool;
        }

        async function fetchTodaysCelebration() {
            const pool = await getSaintPool();
            if (!pool.length) throw new Error('no saints available');
            return pool[dayOfYear() % pool.length];
        }

        async function fetchReflection(celebration) {
            try {
                const res = await fetch(DPS_BRAIN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: celebration.name,
                        type: celebration.type,
                        quote: celebration.quote,
                        description: celebration.description
                    })
                });
                const data = await res.json();
                return data.reflection || '';
            } catch (e) {
                return '';
            }
        }

        function buildBioText(celebration, reflection) {
            const parts = [];
            if (celebration.quote) parts.push(`"${celebration.quote}"`);
            if (celebration.description) parts.push(celebration.description);
            if (reflection) parts.push(reflection);
            return parts.join(' ');
        }

        // Bump this whenever the celebration-picking logic changes -- a
        // cached entry from before the bump is treated as absent instead of
        // silently serving a result computed by the old logic for the rest
        // of that calendar day.
        const DPS_CACHE_VERSION = 5;

        function dpsCacheKey() {
            return 'velo_dps_cache_' + veloTodayString();
        }

        function loadDpsCache() {
            try {
                const raw = localStorage.getItem(dpsCacheKey());
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return parsed.version === DPS_CACHE_VERSION ? parsed : null;
            } catch (e) {
                return null;
            }
        }

        function saveDpsCache(data) {
            try {
                localStorage.setItem(dpsCacheKey(), JSON.stringify({ ...data, version: DPS_CACHE_VERSION }));
            } catch (e) {}
        }

        function renderShell(prayer, celebrationName, celebrationImage) {
            const portrait = celebrationImage
                ? `<img class="dps-saint-portrait" src="${celebrationImage}" alt="${celebrationName}">`
                : `<div class="dps-saint-portrait dps-saint-portrait-fallback">
                       <svg viewBox="0 0 100 100" width="60" height="60">
                           <ellipse cx="50" cy="14" rx="22" ry="6" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6"></ellipse>
                           <circle cx="50" cy="32" r="18" fill="none" stroke="currentColor" stroke-width="3"></circle>
                           <path d="M20 85 Q20 55 50 55 Q80 55 80 85" fill="none" stroke="currentColor" stroke-width="3"></path>
                       </svg>
                   </div>`;

            document.getElementById('pageMain').innerHTML = `
                <div class="content-card dps-prayer-card">
                    <p>${prayer.text}</p>
                </div>
                <div class="content-card dps-saint-card">
                    ${portrait}
                    <h1>${celebrationName}</h1>
                    <p class="dps-bio" id="dpsBio"></p>
                </div>
            `;
        }

        function typeOutText(el, text) {
            return new Promise((resolve) => {
                const words = text.split(/(\s+)/);
                let i = 0;
                function next() {
                    if (i < words.length) {
                        el.textContent = words.slice(0, i + 1).join('');
                        i++;
                        setTimeout(next, Math.random() * 12 + 6);
                    } else {
                        resolve();
                    }
                }
                next();
            });
        }

        async function initDpsPage() {
            veloMarkDoneToday('velo_dps_last_seen');
            initVeloNav('dps');

            const cached = loadDpsCache();
            if (cached) {
                renderShell(cached.prayer, cached.celebration.name, cached.celebration.image);
                document.getElementById('dpsBio').textContent = buildBioText(cached.celebration, cached.reflection);
                return;
            }

            try {
                const celebration = await fetchTodaysCelebration();
                const prayer = todaysPrayer();

                renderShell(prayer, celebration.name, celebration.image);

                const reflection = await fetchReflection(celebration);
                await typeOutText(document.getElementById('dpsBio'), buildBioText(celebration, reflection));
                saveDpsCache({ celebration, prayer, reflection });
            } catch (e) {
                document.getElementById('pageMain').innerHTML = `
                    <div class="content-card">
                        <p class="signin-prompt">Couldn't load today's prayer and saint. Try reloading.</p>
                    </div>
                `;
            }
        }

        initDpsPage();
    </script>
</body>
</html>
