<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELO — Immerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="scrollable-page">

    <header>
        <a href="index.html" class="logo">VELO</a>
        <nav class="tab-nav" id="tabNav"></nav>
        <div class="auth-control" id="authControl"></div>
    </header>

    <main class="page-main immerse-page" id="pageMain"></main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="shared.js"></script>
    <script>
        // A card takes roughly 10-20s to review; 40 cards is a ~15-20 min
        // block -- matched to the short-focused-session research this tab
        // is built around, not an arbitrary number.
        const DAILY_REVIEW_BUDGET = 40;

        function todayISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatDueDate(iso) {
            if (!iso) return '';
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        // Simplified SM-2: three-button grading (Again/Good/Easy) mapped to
        // the standard 0-5 quality scale, since a full 0-5 picker is more
        // friction than a daily review flow needs.
        function gradeCard(card, quality) {
            let ef = card.ease_factor;
            let interval = card.interval_days;
            let reps = card.repetitions;

            if (quality < 3) {
                reps = 0;
                interval = 1;
            } else {
                if (reps === 0) interval = 1;
                else if (reps === 1) interval = 6;
                else interval = Math.round(interval * ef);
                reps += 1;
            }

            ef = Math.max(1.3, ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));

            const nextDate = new Date();
            nextDate.setDate(nextDate.getDate() + interval);

            return {
                ease_factor: ef,
                interval_days: interval,
                repetitions: reps,
                next_review_date: nextDate.toISOString().slice(0, 10),
                last_reviewed_at: new Date().toISOString(),
            };
        }

        function renderSignedOut() {
            const pageMain = document.getElementById('pageMain');
            pageMain.innerHTML = `
                <div class="immerse-wide-card">
                    <h1>Immerse</h1>
                    <p class="subtitle">Sign in to upload course materials and start studying.</p>
                </div>
            `;
        }

        let immerseRenderedUserId = null;

        async function renderSignedIn(session) {
            const userId = session.user.id;
            const pageMain = document.getElementById('pageMain');

            pageMain.innerHTML = `
                <div class="immerse-wide-card immerse-today-card">
                    <h1>Today's Plan</h1>
                    <p class="subtitle" id="planSummary">Loading…</p>
                    <ol class="immerse-plan-numbered" id="todaysPlanList"></ol>
                </div>

                <div class="immerse-two-col">
                    <div class="immerse-wide-card">
                        <h1>Classes</h1>
                        <p class="subtitle">Click a class to manage its materials, deadlines, and study plan.</p>
                        <div class="immerse-class-tabs" id="classTabs"></div>
                    </div>

                    <div class="immerse-wide-card">
                        <h1>Immerse</h1>
                        <div class="immerse-review-body">
                            <p class="subtitle" id="reviewSummary">Loading review queue…</p>
                            <button class="auth-btn immerse-start-btn" id="startReviewBtn" type="button" style="display:none;">Start Review</button>
                            <div id="reviewArea"></div>
                        </div>
                    </div>
                </div>
            `;

            const PLAN_DONE_KEY = `velo_immerse_plan_done_${todayISO()}`;
            function getDoneSet() {
                try { return new Set(JSON.parse(localStorage.getItem(PLAN_DONE_KEY)) || []); }
                catch { return new Set(); }
            }
            function saveDoneSet(set) {
                localStorage.setItem(PLAN_DONE_KEY, JSON.stringify([...set]));
            }

            let classes = [];

            async function loadReviewSummary() {
                const today = todayISO();
                const { count } = await sb.from('cards')
                    .select('id', { count: 'exact', head: true })
                    .eq('user_id', userId)
                    .lte('next_review_date', today);

                const summaryEl = document.getElementById('reviewSummary');
                const startBtn = document.getElementById('startReviewBtn');
                const due = count || 0;

                if (due === 0) {
                    summaryEl.textContent = "Nothing due today. Upload material or check back tomorrow.";
                    startBtn.style.display = 'none';
                } else {
                    const shown = Math.min(due, DAILY_REVIEW_BUDGET);
                    summaryEl.textContent = due > DAILY_REVIEW_BUDGET
                        ? `${shown} of ${due} due cards queued for today (interleaved across classes).`
                        : `${due} card${due === 1 ? '' : 's'} due today, interleaved across your classes.`;
                    startBtn.style.display = 'inline-block';
                }
            }

            async function startReview() {
                const today = todayISO();
                const { data: dueCards, error } = await sb.from('cards')
                    .select('*')
                    .eq('user_id', userId)
                    .lte('next_review_date', today)
                    .order('next_review_date', { ascending: true });

                if (error || !dueCards || !dueCards.length) return;

                const byClass = {};
                dueCards.forEach(c => { (byClass[c.class_id] ||= []).push(c); });

                const queue = [];
                let progress = true;
                while (progress && queue.length < DAILY_REVIEW_BUDGET) {
                    progress = false;
                    for (const cid of Object.keys(byClass)) {
                        const list = byClass[cid];
                        if (list.length) {
                            queue.push(list.shift());
                            progress = true;
                            if (queue.length >= DAILY_REVIEW_BUDGET) break;
                        }
                    }
                }

                document.getElementById('startReviewBtn').style.display = 'none';
                renderReviewQueue(queue);
            }

            function classNameFor(classId) {
                return classes.find(c => c.id === classId)?.name || 'Unknown class';
            }

            function renderReviewQueue(queue) {
                let index = 0;
                const area = document.getElementById('reviewArea');

                function renderCard() {
                    if (index >= queue.length) {
                        area.innerHTML = `<p class="immerse-review-done">Session complete — nice work. 🎯</p>`;
                        loadReviewSummary();
                        return;
                    }

                    const card = queue[index];
                    area.innerHTML = `
                        <div class="immerse-review-progress">${index + 1} / ${queue.length} · ${escapeHtml(classNameFor(card.class_id))}</div>
                        <div class="immerse-review-card" id="reviewCard">
                            <div class="immerse-review-type">${card.card_type}</div>
                            <div class="immerse-review-front">${escapeHtml(card.front)}</div>
                            <div class="immerse-review-back" id="reviewBack" style="display:none;">${escapeHtml(card.back)}</div>
                            <div class="immerse-review-tap" id="revealHint">Tap to reveal</div>
                        </div>
                        <div class="immerse-grade-row" id="gradeRow" style="display:none;">
                            <button class="immerse-grade-btn again" data-quality="2" type="button">Again</button>
                            <button class="immerse-grade-btn good" data-quality="4" type="button">Good</button>
                            <button class="immerse-grade-btn easy" data-quality="5" type="button">Easy</button>
                        </div>
                    `;

                    document.getElementById('reviewCard').onclick = () => {
                        document.getElementById('reviewBack').style.display = 'block';
                        document.getElementById('revealHint').style.display = 'none';
                        document.getElementById('gradeRow').style.display = 'flex';
                    };

                    document.getElementById('gradeRow').querySelectorAll('.immerse-grade-btn').forEach(btn => {
                        btn.onclick = async (e) => {
                            e.stopPropagation();
                            const quality = parseInt(btn.dataset.quality, 10);
                            const update = gradeCard(card, quality);
                            await sb.from('cards').update(update).eq('id', card.id);
                            index++;
                            renderCard();
                        };
                    });
                }

                renderCard();
            }

            async function loadDashboard() {
                const today = todayISO();

                const { data: classRows } = await sb.from('classes').select('*').order('name', { ascending: true });
                classes = classRows || [];

                const tabsEl = document.getElementById('classTabs');
                const planEl = document.getElementById('todaysPlanList');

                if (!classes.length) {
                    tabsEl.innerHTML = `<button class="immerse-class-tab immerse-add-class-tab" id="addClassTab" type="button">+ Add your first class</button>`;
                    document.getElementById('planSummary').textContent = "Add a class to see a plan here.";
                    planEl.innerHTML = '';
                    document.getElementById('addClassTab').onclick = addClass;
                    return;
                }

                const [{ data: classworkRows }, { data: cardRows }] = await Promise.all([
                    sb.from('classwork').select('*').gte('due_date', today).order('due_date', { ascending: true }),
                    sb.from('cards').select('class_id, next_review_date').eq('user_id', userId),
                ]);

                const dueCountByClass = {};
                (cardRows || []).forEach(r => {
                    if (r.next_review_date <= today) dueCountByClass[r.class_id] = (dueCountByClass[r.class_id] || 0) + 1;
                });

                const deadlinesByName = {};
                (classworkRows || []).forEach(r => {
                    if (!r.class_name) return;
                    (deadlinesByName[r.class_name] ||= []).push(r);
                });

                const ranked = classes.map(c => {
                    const dueCount = dueCountByClass[c.id] || 0;
                    const deadlines = deadlinesByName[c.name] || [];
                    const nearest = deadlines[0] || null;
                    const daysUntil = nearest ? Math.ceil((new Date(nearest.due_date) - new Date(today)) / 86400000) : null;
                    const priorityWeight = { low: 0, normal: 1, high: 2 }[c.priority] || 1;

                    let score = priorityWeight * 10 + Math.min(dueCount, 20) * 0.3;
                    if (daysUntil !== null) score += Math.max(0, 14 - daysUntil);

                    return { cls: c, dueCount, nearest, daysUntil, score };
                }).sort((a, b) => b.score - a.score);

                tabsEl.innerHTML = ranked.map(({ cls, dueCount, nearest }) => `
                    <a class="immerse-class-tab" href="immerse-class.html?id=${cls.id}">
                        <div class="immerse-class-tab-name"><span class="immerse-priority-dot ${cls.priority}"></span>${escapeHtml(cls.name)}</div>
                        <div class="immerse-class-tab-meta">${dueCount ? `${dueCount} due today` : 'nothing due'}${nearest ? ` · ${escapeHtml(nearest.title)} ${formatDueDate(nearest.due_date)}` : ''}</div>
                    </a>
                `).join('') + `<button class="immerse-class-tab immerse-add-class-tab" id="addClassTab" type="button">+ Add class</button>`;

                document.getElementById('addClassTab').onclick = addClass;

                // Cap at 5 so it stays a doable day, not a wall of tasks --
                // only classes with something actually pending (a near
                // deadline or cards due) make the list at all.
                const TYPE_LABEL = { homework: 'HW', quiz: 'Quiz prep', test: 'Exam study', project: 'Project work' };
                const TYPE_MINUTES = { homework: 20, quiz: 20, test: 30, project: 25 };
                const planItems = [];
                for (const { cls, dueCount, nearest, daysUntil } of ranked) {
                    if (planItems.length >= 5) break;
                    if (nearest && daysUntil <= 3) {
                        planItems.push({ classId: cls.id, className: cls.name, actionLabel: TYPE_LABEL[nearest.type] || 'Study', minutes: TYPE_MINUTES[nearest.type] || 20 });
                    } else if (dueCount > 0) {
                        planItems.push({ classId: cls.id, className: cls.name, actionLabel: 'Flashcards', minutes: 15 });
                    }
                }

                const summaryEl = document.getElementById('planSummary');
                if (!planItems.length) {
                    summaryEl.textContent = "Nothing urgent today — good day to get ahead on material or a light review.";
                    planEl.innerHTML = `<li class="immerse-plan-empty-item">Nothing due, nothing urgent.</li>`;
                    return;
                }

                const phrases = planItems.map(i => `${i.actionLabel.toLowerCase()} for ${i.className}`);
                summaryEl.textContent = phrases.length === 1
                    ? `Today: ${phrases[0]}.`
                    : `Today: ${phrases.slice(0, -1).join(', ')}, then ${phrases[phrases.length - 1]}.`;

                const doneSet = getDoneSet();
                planEl.innerHTML = planItems.map(item => `
                    <li class="${doneSet.has(item.classId) ? 'done' : ''}" data-class-id="${item.classId}">
                        <input type="checkbox" class="immerse-plan-checkbox"${doneSet.has(item.classId) ? ' checked' : ''}>
                        <a href="immerse-class.html?id=${item.classId}">${escapeHtml(item.className)} — ${escapeHtml(item.actionLabel)}</a>
                        <span class="immerse-plan-time">${item.minutes} min</span>
                    </li>
                `).join('');

                planEl.querySelectorAll('.immerse-plan-checkbox').forEach(cb => {
                    cb.onchange = () => {
                        const li = cb.closest('li');
                        const cid = li.dataset.classId;
                        const set = getDoneSet();
                        if (cb.checked) set.add(cid); else set.delete(cid);
                        saveDoneSet(set);
                        li.classList.toggle('done', cb.checked);
                    };
                });
            }

            async function addClass() {
                const name = (prompt('New class name:') || '').trim();
                if (!name) return;
                const { error } = await sb.from('classes').insert({ user_id: userId, name });
                if (error) { alert("Couldn't add that class: " + error.message); return; }
                loadDashboard();
            }

            document.getElementById('startReviewBtn').onclick = startReview;

            await loadReviewSummary();
            await loadDashboard();
        }

        async function initImmersePage() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                immerseRenderedUserId = session.user.id;
                renderSignedIn(session);
            } else {
                renderSignedOut();
            }

            sb.auth.onAuthStateChange((_event, newSession) => {
                if (newSession && newSession.user.id !== immerseRenderedUserId) {
                    immerseRenderedUserId = newSession.user.id;
                    renderSignedIn(newSession);
                } else if (!newSession && immerseRenderedUserId !== null) {
                    immerseRenderedUserId = null;
                    renderSignedOut();
                }
            });
        }

        initVeloNav('immerse');
        initImmersePage();
    </script>
</body>
</html>
