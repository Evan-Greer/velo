<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELO — ECal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">VELO</a>
        <nav class="tab-nav" id="tabNav"></nav>
        <div class="auth-control" id="authControl"></div>
    </header>

    <main class="ecal-shell centered" id="pageMain">
        <p class="signin-prompt">Loading…</p>
    </main>

    <div class="cal-modal-overlay" id="calModalOverlay">
        <div class="cal-modal">
            <div class="cal-modal-header">
                <h2 id="calModalTitle">New Event</h2>
                <button type="button" class="cal-modal-close" id="calModalClose">✕</button>
            </div>
            <form id="calEventForm">
                <input type="text" id="calFieldTitle" class="cal-modal-title-input" placeholder="Event title" required>

                <label class="cal-checkbox-row">
                    <input type="checkbox" id="calFieldAllDay" checked>
                    All day
                </label>

                <div class="cal-field-row" id="calDateTimeRow">
                    <input type="date" id="calFieldDate" required>
                    <input type="time" id="calFieldStartTime">
                    <span id="calTimeToLabel">to</span>
                    <input type="time" id="calFieldEndTime">
                </div>

                <input type="text" id="calFieldLocation" placeholder="Location">
                <textarea id="calFieldDescription" placeholder="Description" rows="3"></textarea>

                <select id="calFieldReminder">
                    <option value="none">No reminder</option>
                    <option value="10">10 minutes before</option>
                    <option value="30">30 minutes before</option>
                    <option value="60">1 hour before</option>
                    <option value="1440">1 day before</option>
                </select>

                <div class="cal-color-picker" id="calColorPicker"></div>

                <div class="cal-guest-input-row">
                    <input type="email" id="calFieldGuestInput" placeholder="Add guest email and press Enter">
                </div>
                <div class="cal-guest-chips" id="calGuestChips"></div>

                <div class="cal-modal-actions">
                    <button type="button" id="calDeleteBtn" class="cal-delete-event-btn">Delete</button>
                    <button type="submit" class="ecal-add-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="shared.js"></script>
    <script>
        function escapeHtml(str) {
            return (str || '').replace(/</g, '&lt;');
        }

        function formatDueDate(iso) {
            if (!iso) return '';
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function renderSignedOut() {
            const el = document.getElementById('pageMain');
            el.className = 'ecal-shell centered';
            el.innerHTML = `<p class="signin-prompt">Connect your Google account (top right) to use your to-do list, classwork, and calendar.</p>`;
        }

        function renderShell() {
            const el = document.getElementById('pageMain');
            el.className = 'ecal-shell';
            el.innerHTML = `
                <div class="ecal-side-column ecal-left">
                    <h1>To-Do</h1>
                    <form class="ecal-add-form" id="todoForm">
                        <input type="text" id="todoInput" placeholder="Add a to-do…" required>
                        <button type="submit" class="ecal-add-btn">Add</button>
                    </form>
                    <div class="ecal-list" id="todoList"></div>
                </div>

                <div class="ecal-calendar-column">
                    <h1>Calendar</h1>
                    <p class="signin-prompt">Coming next.</p>
                </div>

                <div class="ecal-side-column ecal-right">
                    <h1>Classwork</h1>

                    <form class="ecal-add-form" id="classworkForm">
                        <input type="text" id="classworkTitleInput" placeholder="Title…" required>
                        <div class="ecal-class-select-row">
                            <select id="classworkClassInput" required>
                                <option value="" disabled selected>Select a class</option>
                            </select>
                            <button type="button" class="ecal-delete-btn" id="deleteClassBtn" title="Delete selected class">✕</button>
                        </div>
                        <select id="classworkTypeInput">
                            <option value="homework">Homework</option>
                            <option value="quiz">Quiz</option>
                            <option value="test">Test</option>
                            <option value="project">Project</option>
                        </select>
                        <input type="date" id="classworkDueInput">
                        <button type="submit" class="ecal-add-btn">Add</button>
                    </form>
                    <div class="ecal-list" id="classworkList"></div>
                </div>
            `;
        }

        function renderTodos(todos) {
            const el = document.getElementById('todoList');
            if (!todos.length) {
                el.innerHTML = '<p class="ecal-empty">Nothing on your list.</p>';
                return;
            }
            el.innerHTML = todos.map(t => `
                <div class="ecal-item${t.completed ? ' completed' : ''}" data-id="${t.id}">
                    <input type="checkbox" class="todo-toggle" ${t.completed ? 'checked' : ''}>
                    <div class="ecal-item-body">
                        <div class="ecal-item-title">${escapeHtml(t.text)}</div>
                        ${t.due_date ? `<div class="ecal-item-meta">${formatDueDate(t.due_date)}</div>` : ''}
                    </div>
                    <button class="ecal-delete-btn todo-delete" title="Delete">✕</button>
                </div>
            `).join('');
        }

        function renderClasswork(items) {
            const el = document.getElementById('classworkList');
            if (!items.length) {
                el.innerHTML = '<p class="ecal-empty">No classwork yet.</p>';
                return;
            }
            el.innerHTML = items.map(c => `
                <div class="ecal-item${c.completed ? ' completed' : ''}" data-id="${c.id}">
                    <input type="checkbox" class="classwork-toggle" ${c.completed ? 'checked' : ''}>
                    <div class="ecal-item-body">
                        <div class="ecal-item-title">${escapeHtml(c.title)}${c.class_name ? ` — ${escapeHtml(c.class_name)}` : ''}</div>
                        <div class="ecal-item-meta">${c.type}${c.due_date ? ' · ' + formatDueDate(c.due_date) : ''}</div>
                    </div>
                    <button class="ecal-delete-btn classwork-delete" title="Delete">✕</button>
                </div>
            `).join('');
        }

        async function loadTodos() {
            const { data } = await sb.from('todos').select('*').order('created_at', { ascending: true });
            renderTodos(data || []);
        }

        async function loadClasswork() {
            const { data } = await sb.from('classwork').select('*').order('due_date', { ascending: true, nullsFirst: false });
            renderClasswork(data || []);
        }

        async function loadClasses(selectValue) {
            const { data, error } = await sb.from('classes').select('*').order('name', { ascending: true });
            if (error) console.error('loadClasses failed:', error.message);

            const select = document.getElementById('classworkClassInput');
            select.innerHTML = '<option value="" disabled>Select a class</option>' +
                (data || []).map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('') +
                '<option value="__add_new__">+ Add new class…</option>';

            if (selectValue && (data || []).some(c => c.name === selectValue)) {
                select.value = selectValue;
            } else {
                select.selectedIndex = 0;
            }
        }

        function wireClassSelect(userId) {
            const select = document.getElementById('classworkClassInput');
            select.addEventListener('change', async () => {
                if (select.value !== '__add_new__') return;

                const name = (prompt('New class name:') || '').trim();
                if (!name) {
                    select.selectedIndex = 0;
                    return;
                }

                const { error } = await sb.from('classes').insert({ user_id: userId, name });
                if (error) {
                    alert("Couldn't add that class: " + error.message);
                    select.selectedIndex = 0;
                    return;
                }
                loadClasses(name);
            });

            document.getElementById('deleteClassBtn').onclick = async () => {
                const className = select.value;
                if (!className || className === '__add_new__') return;
                if (!confirm(`Delete "${className}"? Classwork already using it will keep the name, but you won't be able to pick it again.`)) return;

                const { error } = await sb.from('classes').delete().eq('user_id', userId).eq('name', className);
                if (error) {
                    alert("Couldn't delete that class: " + error.message);
                    return;
                }
                loadClasses();
            };
        }

        function wireTodoList(userId) {
            document.getElementById('todoForm').onsubmit = async (e) => {
                e.preventDefault();
                const input = document.getElementById('todoInput');
                const text = input.value.trim();
                if (!text) return;
                const { error } = await sb.from('todos').insert({ user_id: userId, text });
                if (error) { alert("Couldn't add that to-do: " + error.message); return; }
                input.value = '';
                loadTodos();
            };

            document.getElementById('todoList').onclick = async (e) => {
                const item = e.target.closest('.ecal-item');
                if (!item) return;
                const id = item.dataset.id;

                if (e.target.classList.contains('todo-toggle')) {
                    await sb.from('todos').update({ completed: e.target.checked }).eq('id', id);
                    loadTodos();
                } else if (e.target.classList.contains('todo-delete')) {
                    await sb.from('todos').delete().eq('id', id);
                    loadTodos();
                }
            };
        }

        function wireClassworkList(userId) {
            document.getElementById('classworkForm').onsubmit = async (e) => {
                e.preventDefault();
                const title = document.getElementById('classworkTitleInput').value.trim();
                if (!title) return;
                const className = document.getElementById('classworkClassInput').value;
                const type = document.getElementById('classworkTypeInput').value;
                const dueDate = document.getElementById('classworkDueInput').value || null;

                const { error } = await sb.from('classwork').insert({
                    user_id: userId,
                    title,
                    class_name: className || null,
                    type,
                    due_date: dueDate
                });
                if (error) { alert("Couldn't add that classwork: " + error.message); return; }

                e.target.reset();
                loadClasswork();
            };

            document.getElementById('classworkList').onclick = async (e) => {
                const item = e.target.closest('.ecal-item');
                if (!item) return;
                const id = item.dataset.id;

                if (e.target.classList.contains('classwork-toggle')) {
                    await sb.from('classwork').update({ completed: e.target.checked }).eq('id', id);
                    loadClasswork();
                } else if (e.target.classList.contains('classwork-delete')) {
                    await sb.from('classwork').delete().eq('id', id);
                    loadClasswork();
                }
            };
        }

        const CAL_API_BASE = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
        const CAL_COLORS = [
            { id: '', name: 'Default', hex: '#4a90d9' },
            { id: '1', name: 'Lavender', hex: '#7986cb' },
            { id: '2', name: 'Sage', hex: '#33b679' },
            { id: '3', name: 'Grape', hex: '#8e24aa' },
            { id: '4', name: 'Flamingo', hex: '#e67c73' },
            { id: '5', name: 'Banana', hex: '#f6c026' },
            { id: '6', name: 'Tangerine', hex: '#f5511d' },
            { id: '7', name: 'Peacock', hex: '#039be5' },
            { id: '8', name: 'Graphite', hex: '#616161' },
            { id: '9', name: 'Blueberry', hex: '#3f51b5' },
            { id: '10', name: 'Basil', hex: '#0b8043' },
            { id: '11', name: 'Tomato', hex: '#d60000' }
        ];

        let calViewDate = new Date();
        let calViewMode = 'month';
        let calAccessToken = null;
        let calEventsById = {};
        let calGuestList = [];
        let calSelectedColorId = '';
        let calEditingEventId = null;
        const CAL_ROW_H = 48;

        function colorHex(colorId) {
            const match = CAL_COLORS.find(c => c.id === (colorId || ''));
            return match ? match.hex : CAL_COLORS[0].hex;
        }

        function dateToISO(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function timeToMinutes(dateTimeStr) {
            const d = new Date(dateTimeStr);
            return d.getHours() * 60 + d.getMinutes();
        }

        function formatHourLabel(h) {
            if (h === 0) return '12 AM';
            if (h === 12) return '12 PM';
            return h < 12 ? `${h} AM` : `${h - 12} PM`;
        }

        function getWeekStart(date) {
            const d = new Date(date);
            d.setDate(d.getDate() - d.getDay());
            d.setHours(0, 0, 0, 0);
            return d;
        }

        async function fetchCalendarEventsRange(accessToken, minDate, maxDate) {
            const url = `${CAL_API_BASE}?timeMin=${encodeURIComponent(minDate.toISOString())}&timeMax=${encodeURIComponent(maxDate.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=250`;

            const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });

            if (res.status === 401) throw { tokenExpired: true };
            if (!res.ok) throw new Error('Failed to load calendar events');

            const data = await res.json();
            return data.items || [];
        }

        function groupEventsByDate(events) {
            const map = {};
            events.forEach(e => {
                const dateStr = e.start.date || (e.start.dateTime || '').slice(0, 10);
                if (!dateStr) return;
                (map[dateStr] = map[dateStr] || []).push(e);
            });
            return map;
        }

        function groupEventsByDayAndAllDay(events, days) {
            const byDay = days.map(() => []);
            const allDayByDay = days.map(() => []);
            const dayIndexByISO = {};
            days.forEach((d, i) => { dayIndexByISO[dateToISO(d)] = i; });

            events.forEach(e => {
                const isAllDay = !!e.start.date;
                const dateStr = e.start.date || e.start.dateTime.slice(0, 10);
                const idx = dayIndexByISO[dateStr];
                if (idx === undefined) return;
                (isAllDay ? allDayByDay : byDay)[idx].push(e);
            });

            return { byDay, allDayByDay };
        }

        function renderCalendarShell() {
            document.querySelector('.ecal-calendar-column').innerHTML = `
                <div class="cal-header">
                    <button type="button" class="cal-nav-btn" id="calPrevBtn">‹</button>
                    <h1 id="calMonthLabel"></h1>
                    <button type="button" class="cal-nav-btn" id="calNextBtn">›</button>
                    <div class="cal-view-switcher" id="calViewSwitcher">
                        <button type="button" class="cal-view-btn active" data-view="month">Month</button>
                        <button type="button" class="cal-view-btn" data-view="week">Week</button>
                        <button type="button" class="cal-view-btn" data-view="day">Day</button>
                    </div>
                    <button type="button" class="ecal-add-btn cal-add-event-btn" id="calAddEventBtn">+ Add Event</button>
                </div>
                <div id="calBody"></div>
            `;
        }

        function wireGridClicks(container) {
            container.onclick = (e) => {
                const chip = e.target.closest('.cal-event-chip, .cal-time-event');
                if (chip) {
                    const event = calEventsById[chip.dataset.eventId];
                    if (event) openEventModal(event);
                    return;
                }
                const alldayCell = e.target.closest('.cal-allday-cell');
                if (alldayCell) {
                    openEventModal(null, alldayCell.dataset.date);
                    return;
                }
                const cell = e.target.closest('.cal-cell');
                if (cell && !cell.classList.contains('empty')) {
                    openEventModal(null, cell.dataset.date);
                }
            };
        }

        function snapTo15(minutes) {
            return Math.round(minutes / 15) * 15;
        }

        function minutesToTimeStr(totalMinutes) {
            const clamped = Math.max(0, Math.min(1439, totalMinutes));
            const h = Math.floor(clamped / 60);
            const m = clamped % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        let calDragState = null;

        function wireTimeGridDrag(container) {
            container.addEventListener('mousedown', (e) => {
                if (e.target.closest('.cal-time-event')) return;
                const col = e.target.closest('.cal-time-day-col');
                if (!col) return;

                const rect = col.getBoundingClientRect();
                const startMinutes = snapTo15(Math.max(0, Math.min(1440, ((e.clientY - rect.top) / CAL_ROW_H) * 60)));

                const ghost = document.createElement('div');
                ghost.className = 'cal-time-event cal-drag-ghost';
                ghost.style.top = (startMinutes / 60 * CAL_ROW_H) + 'px';
                ghost.style.height = '4px';
                col.appendChild(ghost);

                calDragState = { date: col.dataset.date, col, startMinutes, currentMinutes: startMinutes, ghostEl: ghost };
                e.preventDefault();
            });
        }

        document.addEventListener('mousemove', (e) => {
            if (!calDragState) return;
            const rect = calDragState.col.getBoundingClientRect();
            const minutes = snapTo15(Math.max(0, Math.min(1440, ((e.clientY - rect.top) / CAL_ROW_H) * 60)));
            calDragState.currentMinutes = minutes;

            const top = Math.min(calDragState.startMinutes, minutes);
            const bottom = Math.max(calDragState.startMinutes, minutes);
            calDragState.ghostEl.style.top = (top / 60 * CAL_ROW_H) + 'px';
            calDragState.ghostEl.style.height = Math.max((bottom - top) / 60 * CAL_ROW_H, 4) + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (!calDragState) return;
            const { date, startMinutes, currentMinutes, ghostEl } = calDragState;
            ghostEl.remove();
            calDragState = null;

            let start = Math.min(startMinutes, currentMinutes);
            let end = Math.max(startMinutes, currentMinutes);
            if (end - start < 15) end = start + 30; // plain click/tap -> 30min default, not a real drag

            openEventModal(null, date, start, end);
        });

        function renderMonthGrid(year, month, eventsByDate) {
            document.getElementById('calMonthLabel').textContent =
                new Date(year, month, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

            const firstWeekday = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = veloTodayString();

            let cells = '';
            for (let i = 0; i < firstWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayEvents = eventsByDate[dateStr] || [];
                cells += `
                    <div class="cal-cell${dateStr === today ? ' today' : ''}" data-date="${dateStr}">
                        <div class="cal-day-num">${d}</div>
                        ${dayEvents.slice(0, 3).map(e => `<div class="cal-event-chip" data-event-id="${e.id}" style="background:${colorHex(e.colorId)}22;color:${colorHex(e.colorId)}" title="${escapeHtml(e.summary || '(untitled)')}">${escapeHtml(e.summary || '(untitled)')}</div>`).join('')}
                        ${dayEvents.length > 3 ? `<div class="cal-more">+${dayEvents.length - 3} more</div>` : ''}
                    </div>
                `;
            }

            const body = document.getElementById('calBody');
            body.innerHTML = `
                <div class="cal-weekdays">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div class="cal-grid" id="calGrid">${cells}</div>
            `;
            wireGridClicks(document.getElementById('calGrid'));
        }

        function renderTimeGrid(days, eventsByDay, allDayByDay) {
            const today = veloTodayString();

            const headerCols = days.map(d => {
                const dateStr = dateToISO(d);
                return `<div class="cal-time-day-header${dateStr === today ? ' today' : ''}">
                    <div class="cal-time-day-name">${d.toLocaleDateString(undefined, { weekday: 'short' })}</div>
                    <div class="cal-time-day-num">${d.getDate()}</div>
                </div>`;
            }).join('');

            const alldayCols = days.map((d, i) => {
                const dateStr = dateToISO(d);
                const events = allDayByDay[i] || [];
                return `<div class="cal-allday-cell" data-date="${dateStr}">
                    ${events.map(e => `<div class="cal-event-chip" data-event-id="${e.id}" style="background:${colorHex(e.colorId)}22;color:${colorHex(e.colorId)}">${escapeHtml(e.summary || '(untitled)')}</div>`).join('')}
                </div>`;
            }).join('');

            const hourLabels = Array.from({ length: 24 }, (_, h) =>
                `<div class="cal-hour-label" style="height:${CAL_ROW_H}px">${formatHourLabel(h)}</div>`
            ).join('');

            const dayCols = days.map((d, i) => {
                const dateStr = dateToISO(d);
                let slots = '';
                for (let h = 0; h < 24; h++) {
                    slots += `<div class="cal-hour-slot" data-date="${dateStr}" data-hour="${h}" style="height:${CAL_ROW_H}px"></div>`;
                }
                const events = (eventsByDay[i] || []).map(e => {
                    if (!e.start.dateTime) return '';
                    const startMin = timeToMinutes(e.start.dateTime);
                    const endMin = e.end.dateTime ? timeToMinutes(e.end.dateTime) : startMin + 60;
                    const top = (startMin / 60) * CAL_ROW_H;
                    const height = Math.max(((endMin - startMin) / 60) * CAL_ROW_H, 20);
                    return `<div class="cal-time-event" data-event-id="${e.id}" style="top:${top}px;height:${height}px;background:${colorHex(e.colorId)}33;border-left:3px solid ${colorHex(e.colorId)}" title="${escapeHtml(e.summary || '(untitled)')}">${escapeHtml(e.summary || '(untitled)')}</div>`;
                }).join('');
                return `<div class="cal-time-day-col">${slots}${events}</div>`;
            }).join('');

            const body = document.getElementById('calBody');
            body.innerHTML = `
                <div class="cal-time-header-row" style="grid-template-columns: 56px repeat(${days.length}, 1fr);">
                    <div class="cal-time-gutter"></div>${headerCols}
                </div>
                <div class="cal-allday-row" style="grid-template-columns: 56px repeat(${days.length}, 1fr);">
                    <div class="cal-time-gutter cal-allday-label">All-day</div>${alldayCols}
                </div>
                <div class="cal-time-scroll">
                    <div class="cal-time-body">
                        <div class="cal-hour-labels">${hourLabels}</div>
                        <div class="cal-time-cols">${dayCols}</div>
                    </div>
                </div>
            `;

            wireGridClicks(body);
            wireTimeGridDrag(body.querySelector('.cal-time-cols'));
            const scrollEl = body.querySelector('.cal-time-scroll');
            if (scrollEl) scrollEl.scrollTop = 7 * CAL_ROW_H;
        }

        function renderCalendarReconnect() {
            document.querySelector('.ecal-calendar-column').innerHTML = `
                <h1>Calendar</h1>
                <p class="signin-prompt">Your Google Calendar connection expired.</p>
                <button type="button" class="auth-btn" id="calReconnectBtn">Reconnect Calendar</button>
            `;
            document.getElementById('calReconnectBtn').onclick = signInWithGoogle;
        }

        function handleCalendarError(e) {
            if (e.tokenExpired) {
                renderCalendarReconnect();
            } else {
                document.querySelector('.ecal-calendar-column').innerHTML =
                    `<h1>Calendar</h1><p class="signin-prompt">Couldn't load calendar events.</p>`;
            }
        }

        async function loadMonthView() {
            const year = calViewDate.getFullYear();
            const month = calViewDate.getMonth();
            try {
                const events = await fetchCalendarEventsRange(calAccessToken, new Date(year, month, 1), new Date(year, month + 1, 1));
                calEventsById = {};
                events.forEach(e => { calEventsById[e.id] = e; });
                renderMonthGrid(year, month, groupEventsByDate(events));
            } catch (e) {
                handleCalendarError(e);
            }
        }

        async function loadWeekView() {
            const start = getWeekStart(calViewDate);
            const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d; });
            const end = new Date(start); end.setDate(end.getDate() + 7);

            try {
                const events = await fetchCalendarEventsRange(calAccessToken, start, end);
                calEventsById = {};
                events.forEach(e => { calEventsById[e.id] = e; });

                const end6 = days[6];
                const startLabel = start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                const endLabel = start.getMonth() === end6.getMonth()
                    ? `${end6.getDate()}, ${end6.getFullYear()}`
                    : end6.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                document.getElementById('calMonthLabel').textContent = `${startLabel} – ${endLabel}`;

                const { byDay, allDayByDay } = groupEventsByDayAndAllDay(events, days);
                renderTimeGrid(days, byDay, allDayByDay);
            } catch (e) {
                handleCalendarError(e);
            }
        }

        async function loadDayView() {
            const start = new Date(calViewDate); start.setHours(0, 0, 0, 0);
            const end = new Date(start); end.setDate(end.getDate() + 1);
            const days = [start];

            try {
                const events = await fetchCalendarEventsRange(calAccessToken, start, end);
                calEventsById = {};
                events.forEach(e => { calEventsById[e.id] = e; });

                document.getElementById('calMonthLabel').textContent =
                    start.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

                const { byDay, allDayByDay } = groupEventsByDayAndAllDay(events, days);
                renderTimeGrid(days, byDay, allDayByDay);
            } catch (e) {
                handleCalendarError(e);
            }
        }

        function refreshCalendar() {
            if (!calAccessToken) return;
            if (calViewMode === 'month') loadMonthView();
            else if (calViewMode === 'week') loadWeekView();
            else loadDayView();
        }

        function toggleTimeFieldsVisibility() {
            const allDay = document.getElementById('calFieldAllDay').checked;
            document.getElementById('calFieldStartTime').style.display = allDay ? 'none' : '';
            document.getElementById('calFieldEndTime').style.display = allDay ? 'none' : '';
            document.getElementById('calTimeToLabel').style.display = allDay ? 'none' : '';
        }

        function renderGuestChips() {
            document.getElementById('calGuestChips').innerHTML = calGuestList.map((email, i) => `
                <span class="cal-guest-chip">${escapeHtml(email)}<button type="button" data-i="${i}" class="cal-guest-remove">✕</button></span>
            `).join('');
        }

        function renderColorPicker() {
            document.getElementById('calColorPicker').innerHTML = CAL_COLORS.map(c => `
                <button type="button" class="cal-color-swatch${c.id === calSelectedColorId ? ' selected' : ''}" data-color-id="${c.id}" style="background:${c.hex}" title="${c.name}"></button>
            `).join('');
        }

        function openEventModal(event, presetDate, presetStartMinutes, presetEndMinutes) {
            calEditingEventId = event ? event.id : null;
            calGuestList = (event && event.attendees) ? event.attendees.map(a => a.email) : [];
            calSelectedColorId = event ? (event.colorId || '') : '';

            document.getElementById('calModalTitle').textContent = event ? 'Edit Event' : 'New Event';
            document.getElementById('calFieldTitle').value = event ? (event.summary || '') : '';
            document.getElementById('calFieldLocation').value = event ? (event.location || '') : '';
            document.getElementById('calFieldDescription').value = event ? (event.description || '') : '';

            const isAllDay = event ? !!event.start.date : (presetStartMinutes === null || presetStartMinutes === undefined);
            document.getElementById('calFieldAllDay').checked = isAllDay;

            if (event) {
                document.getElementById('calFieldDate').value = event.start.date || event.start.dateTime.slice(0, 10);
                document.getElementById('calFieldStartTime').value = event.start.dateTime ? event.start.dateTime.slice(11, 16) : '';
                document.getElementById('calFieldEndTime').value = event.end.dateTime ? event.end.dateTime.slice(11, 16) : '';
            } else {
                document.getElementById('calFieldDate').value = presetDate || veloTodayString();
                if (presetStartMinutes !== null && presetStartMinutes !== undefined) {
                    document.getElementById('calFieldStartTime').value = minutesToTimeStr(presetStartMinutes);
                    document.getElementById('calFieldEndTime').value = minutesToTimeStr(presetEndMinutes != null ? presetEndMinutes : presetStartMinutes + 30);
                } else {
                    document.getElementById('calFieldStartTime').value = '';
                    document.getElementById('calFieldEndTime').value = '';
                }
            }

            const reminderSelect = document.getElementById('calFieldReminder');
            if (event && event.reminders && event.reminders.overrides && event.reminders.overrides.length) {
                reminderSelect.value = String(event.reminders.overrides[0].minutes);
            } else {
                reminderSelect.value = 'none';
            }

            renderGuestChips();
            renderColorPicker();
            toggleTimeFieldsVisibility();

            document.getElementById('calDeleteBtn').style.display = event ? '' : 'none';
            document.getElementById('calModalOverlay').classList.add('open');
        }

        function closeEventModal() {
            document.getElementById('calModalOverlay').classList.remove('open');
        }

        async function submitEventForm(e) {
            e.preventDefault();
            const title = document.getElementById('calFieldTitle').value.trim();
            if (!title) return;

            const allDay = document.getElementById('calFieldAllDay').checked;
            const date = document.getElementById('calFieldDate').value;
            const location = document.getElementById('calFieldLocation').value.trim();
            const description = document.getElementById('calFieldDescription').value.trim();
            const reminderMinutes = document.getElementById('calFieldReminder').value;

            let start, end;
            if (allDay) {
                const nextDay = new Date(date + 'T00:00:00');
                nextDay.setDate(nextDay.getDate() + 1);
                start = { date };
                end = { date: nextDay.toISOString().slice(0, 10) };
            } else {
                const startTime = document.getElementById('calFieldStartTime').value || '09:00';
                const endTime = document.getElementById('calFieldEndTime').value || '10:00';
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                start = { dateTime: `${date}T${startTime}:00`, timeZone: tz };
                end = { dateTime: `${date}T${endTime}:00`, timeZone: tz };
            }

            const payload = {
                summary: title,
                location: location || undefined,
                description: description || undefined,
                start,
                end,
                attendees: calGuestList.map(email => ({ email })),
                reminders: reminderMinutes === 'none'
                    ? { useDefault: false, overrides: [] }
                    : { useDefault: false, overrides: [{ method: 'popup', minutes: Number(reminderMinutes) }] },
                colorId: calSelectedColorId || undefined
            };

            const url = calEditingEventId ? `${CAL_API_BASE}/${calEditingEventId}` : CAL_API_BASE;
            const method = calEditingEventId ? 'PATCH' : 'POST';

            const res = await fetch(`${url}?sendUpdates=all`, {
                method,
                headers: { Authorization: `Bearer ${calAccessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.status === 401) { closeEventModal(); renderCalendarReconnect(); return; }
            if (!res.ok) { alert("Couldn't save that event."); return; }

            closeEventModal();
            refreshCalendar();
        }

        async function deleteCurrentEvent() {
            if (!calEditingEventId) return;
            if (!confirm('Delete this event?')) return;

            const res = await fetch(`${CAL_API_BASE}/${calEditingEventId}?sendUpdates=all`, {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${calAccessToken}` }
            });

            if (res.status === 401) { closeEventModal(); renderCalendarReconnect(); return; }
            if (!res.ok && res.status !== 410) { alert("Couldn't delete that event."); return; }

            closeEventModal();
            refreshCalendar();
        }

        function wireEventModal() {
            document.getElementById('calModalClose').onclick = closeEventModal;
            document.getElementById('calModalOverlay').onclick = (e) => {
                if (e.target.id === 'calModalOverlay') closeEventModal();
            };
            document.getElementById('calFieldAllDay').onchange = toggleTimeFieldsVisibility;
            document.getElementById('calEventForm').onsubmit = submitEventForm;
            document.getElementById('calDeleteBtn').onclick = deleteCurrentEvent;

            document.getElementById('calFieldGuestInput').onkeydown = (e) => {
                if (e.key !== 'Enter') return;
                e.preventDefault();
                const email = e.target.value.trim();
                if (email && email.includes('@') && !calGuestList.includes(email)) {
                    calGuestList.push(email);
                    renderGuestChips();
                }
                e.target.value = '';
            };

            document.getElementById('calGuestChips').onclick = (e) => {
                const btn = e.target.closest('.cal-guest-remove');
                if (!btn) return;
                calGuestList.splice(Number(btn.dataset.i), 1);
                renderGuestChips();
            };

            document.getElementById('calColorPicker').onclick = (e) => {
                const swatch = e.target.closest('.cal-color-swatch');
                if (!swatch) return;
                calSelectedColorId = swatch.dataset.colorId;
                renderColorPicker();
            };
        }

        function initCalendar(session) {
            calAccessToken = session.provider_token;
            if (!calAccessToken) {
                renderCalendarReconnect();
                return;
            }

            renderCalendarShell();
            wireEventModal();

            calViewDate = new Date();
            calViewMode = 'month';

            document.getElementById('calPrevBtn').onclick = () => {
                if (calViewMode === 'month') calViewDate.setMonth(calViewDate.getMonth() - 1);
                else if (calViewMode === 'week') calViewDate.setDate(calViewDate.getDate() - 7);
                else calViewDate.setDate(calViewDate.getDate() - 1);
                refreshCalendar();
            };
            document.getElementById('calNextBtn').onclick = () => {
                if (calViewMode === 'month') calViewDate.setMonth(calViewDate.getMonth() + 1);
                else if (calViewMode === 'week') calViewDate.setDate(calViewDate.getDate() + 7);
                else calViewDate.setDate(calViewDate.getDate() + 1);
                refreshCalendar();
            };
            document.getElementById('calAddEventBtn').onclick = () => openEventModal(null);

            document.getElementById('calViewSwitcher').onclick = (e) => {
                const btn = e.target.closest('.cal-view-btn');
                if (!btn) return;
                calViewMode = btn.dataset.view;
                document.querySelectorAll('.cal-view-btn').forEach(b => b.classList.toggle('active', b === btn));
                refreshCalendar();
            };

            refreshCalendar();
        }

        async function renderSignedIn(session) {
            renderShell();
            wireTodoList(session.user.id);
            wireClassworkList(session.user.id);
            wireClassSelect(session.user.id);
            loadTodos();
            loadClasswork();
            loadClasses();
            initCalendar(session);
        }

        let ecalRenderedUserId = null;

        async function initEcalPage() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                ecalRenderedUserId = session.user.id;
                renderSignedIn(session);
            } else {
                renderSignedOut();
            }
            // Supabase fires this on background token refresh too (e.g. when the
            // tab regains focus), not just on real sign-in/out. Only rebuild the
            // page when who's signed in actually changes -- otherwise this was
            // silently resetting the calendar view, to-do scroll position, etc.
            // on every alt-tab back to the browser.
            sb.auth.onAuthStateChange((_event, newSession) => {
                if (newSession && newSession.user.id !== ecalRenderedUserId) {
                    ecalRenderedUserId = newSession.user.id;
                    renderSignedIn(newSession);
                } else if (!newSession && ecalRenderedUserId !== null) {
                    ecalRenderedUserId = null;
                    renderSignedOut();
                }
            });
        }

        initVeloNav('ecal');
        initEcalPage();
    </script>
</body>
