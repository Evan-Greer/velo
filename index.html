    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="shared.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const homeSection = document.getElementById('home');
        const orbWrapper = document.getElementById('orbWrapper');
        const orbContainer = document.getElementById('veloOrbContainer');
        const historyPanel = document.getElementById('historyPanel');
        const historyList = document.getElementById('historyList');
        const spaceContainer = document.getElementById('spaceCanvasContainer');
        const SUPABASE_FUNCTION_URL = "https://vgkbefoasgqmainbmvhz.supabase.co/functions/v1/velo-brain";

        let currentActiveChat = [];

        let scene, camera, renderer, particleSystem, originalPositions;
        let spaceScene, spaceCamera, spaceRenderer, starField, customStarGroup;
        let rockTexture;
        let sharedDotTexture;

        let cosmicElements = [];
        let satelliteLights = [];
        let nextEventTime = 0;

        let rocketCount = 0;
        let satelliteCount = 0;

        const PARTICLE_COUNT = 55000;
        const MINI_PARTICLE_COUNT = 2000; // Doubled particles
        const STAR_COUNT = 5000; 

        let baseRotationSpeed = 0.0012; 
        let currentSpeedMultiplier = 1.0;
        let targetSpeedMultiplier = 1.0;

        let activeMiniOrbInstances = [];

        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(220, 240, 255, 0.95)');
            gradient.addColorStop(0.5, 'rgba(120, 175, 210, 0.45)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            
            return new THREE.CanvasTexture(canvas);
        }

        function createRockTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#2c2f36';
            ctx.fillRect(0, 0, 128, 128);

            for (let i = 0; i < 800; i++) {
                const x = Math.random() * 128;
                const y = Math.random() * 128;
                const radius = Math.random() * 3 + 1;
                const shade = Math.floor(Math.random() * 120 + 20);
                ctx.fillStyle = `rgba(${shade}, ${shade}, ${shade}, 0.28)`;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createRealisticAsteroidGeometry() {
            const geom = new THREE.IcosahedronGeometry(0.09, 1); 
            const pos = geom.attributes.position;
            
            const noiseX = 25.0;
            const noiseY = 25.0;
            const noiseZ = 25.0;

            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                let z = pos.getZ(i);

                let spikeFactor = Math.sign(Math.sin(x * noiseX)) * 0.055 + 
                                  Math.sign(Math.cos(y * noiseY)) * 0.045 + 
                                  Math.sin(z * noiseZ) * 0.035;

                pos.setX(i, x + x * spikeFactor);
                pos.setY(i, y + y * spikeFactor);
                pos.setZ(i, z + z * spikeFactor);
            }
            geom.computeVertexNormals();
            return geom;
        }

        function createRealisticSatelliteMesh() {
            const group = new THREE.Group();
            const busMat = new THREE.MeshBasicMaterial({ color: 0x292a2f });
            const foilMat = new THREE.MeshBasicMaterial({ color: 0xbfa133 }); 
            const panelMat = new THREE.MeshBasicMaterial({ color: 0x16263d, side: THREE.DoubleSide });
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.08), busMat);
            group.add(body);
            
            const instrumentCap = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.04, 6), foilMat);
            instrumentCap.position.y = 0.08;
            group.add(instrumentCap);

            const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.44, 4), busMat);
            crossbar.rotation.z = Math.PI / 2;
            group.add(crossbar);
            
            const leftWing = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.005), panelMat);
            leftWing.position.x = -0.16;
            group.add(leftWing);

            const rightWing = leftWing.clone();
            rightWing.position.x = 0.16;
            group.add(rightWing);

            const lightColors = [0x00cc55, 0xdddddd];
            const beaconGeom = new THREE.SphereGeometry(0.007, 4, 4);
            
            const beacon1 = new THREE.Mesh(beaconGeom, new THREE.MeshBasicMaterial({ color: lightColors[0] }));
            beacon1.position.set(-0.03, 0.06, 0.04);
            group.add(beacon1);
            satelliteLights.push({ mesh: beacon1, pulseType: 'alt', baseColor: lightColors[0] });

            const beacon2 = new THREE.Mesh(beaconGeom, new THREE.MeshBasicMaterial({ color: lightColors[1] }));
            beacon2.position.set(0.03, -0.06, -0.04);
            group.add(beacon2);
            satelliteLights.push({ mesh: beacon2, pulseType: 'blink', baseColor: lightColors[1] });
            
            return group;
        }

        function createSpaceXRocketMesh() {
            const rocketGroup = new THREE.Group();
            const steelMat = new THREE.MeshBasicMaterial({ color: 0x2e3036 }); 
            const flapMat = new THREE.MeshBasicMaterial({ color: 0x16171a }); 
            
            const mainCylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.24, 12), steelMat);
            rocketGroup.add(mainCylinder);

            const noseCone = new THREE.Mesh(new THREE.ConeGeometry(0.032, 0.08, 12), steelMat);
            noseCone.position.y = 0.16;
            rocketGroup.add(noseCone);

            const fFlapL = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.012, 0.004), flapMat);
            fFlapL.position.set(-0.036, 0.12, 0);
            const fFlapR = fFlapL.clone();
            fFlapR.position.x = 0.036;
            rocketGroup.add(fFlapL, fFlapR);

            const aFlapL = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.04, 0.005), flapMat);
            aFlapL.position.set(-0.042, -0.09, 0);
            const aFlapR = aFlapL.clone();
            aFlapR.position.x = 0.042;
            rocketGroup.add(aFlapL, aFlapR);

            const flameContainer = new THREE.Group();
            flameContainer.position.y = -0.12; 

            const flameCore = new THREE.Mesh(
                new THREE.ConeGeometry(0.016, 0.13, 8),
                new THREE.MeshBasicMaterial({ color: 0xff9900, transparent: true, opacity: 0.9 })
            );
            flameCore.position.y = -0.065;
            flameCore.rotation.x = Math.PI;
            flameContainer.add(flameCore);

            const flameOuter = new THREE.Mesh(
                new THREE.ConeGeometry(0.026, 0.20, 8),
                new THREE.MeshBasicMaterial({ color: 0xee5500, transparent: true, opacity: 0.45 })
            );
            flameOuter.position.y = -0.10;
            flameOuter.rotation.x = Math.PI;
            flameContainer.add(flameOuter);

            rocketGroup.add(flameContainer);
            
            return { group: rocketGroup };
        }

        function createShootingStarMesh() {
            const group = new THREE.Group();
            const tailGeom = new THREE.ConeGeometry(0.012, 0.45, 6);
            const tailMat = new THREE.MeshBasicMaterial({
                color: 0x92b4c6,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending
            });
            const tail = new THREE.Mesh(tailGeom, tailMat);
            tail.position.y = 0.225;
            group.add(tail);
            return group;
        }

        /* --- 2000 BRIGHTENED METALLIC VELO ORB --- */
        function create2000BeadMiniVelo(containerEl) {
            const miniScene = new THREE.Scene();
            const miniCamera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
            miniCamera.position.z = 2.4;

            const miniRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            miniRenderer.setSize(42, 42); // 10% Bigger canvas container
            miniRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            containerEl.appendChild(miniRenderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(MINI_PARTICLE_COUNT * 3);
            const colors = new Float32Array(MINI_PARTICLE_COUNT * 3);
            const miniOriginals = new Float32Array(MINI_PARTICLE_COUNT * 3);

            // Shifting matrix towards vibrant, electric metallic blues
            const metallicCoreColor = new THREE.Color(0xdceffa); 
            const metallicMidColor = new THREE.Color(0x92c2dd);  
            const metallicEdgeColor = new THREE.Color(0x52829c); 

            for (let i = 0; i < MINI_PARTICLE_COUNT; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                
                let radius = 0.85 + (Math.random() * 0.04);

                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                miniOriginals[i * 3] = x;
                miniOriginals[i * 3 + 1] = y;
                miniOriginals[i * 3 + 2] = z;

                let mixVal = Math.random();
                let mixedColor;
                if(mixVal < 0.5) {
                    mixedColor = metallicCoreColor.clone().lerp(metallicMidColor, Math.random());
                } else {
                    mixedColor = metallicMidColor.clone().lerp(metallicEdgeColor, Math.random());
                }
                
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.16, // Brightened size up from 0.125
                map: sharedDotTexture,
                vertexColors: true,
                transparent: true,
                opacity: 1.0, 
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const miniParticleSystem = new THREE.Points(geometry, material);
            miniScene.add(miniParticleSystem);

            const instance = {
                scene: miniScene,
                camera: miniCamera,
                renderer: miniRenderer,
                particles: miniParticleSystem,
                originals: miniOriginals,
                container: containerEl,
                targetSpeed: 0.003, 
                currentSpeed: 0.003
            };

            activeMiniOrbInstances.push(instance);
            return instance;
        }

        function initEnvironment() {
            sharedDotTexture = createCircleTexture();
            rockTexture = createRockTexture();

            spaceScene = new THREE.Scene();
            spaceCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            spaceCamera.position.z = 7;

            const starGeo = new THREE.BufferGeometry();
            const starPositions = new Float32Array(STAR_COUNT * 3);

            for(let i=0; i<STAR_COUNT*3; i+=3) {
                starPositions[i] = (Math.random() - 0.5) * 25;
                starPositions[i+1] = (Math.random() - 0.5) * 25;
                starPositions[i+2] = (Math.random() - 0.5) * 12;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            
            const starMat = new THREE.PointsMaterial({
                size: 0.012, 
                map: sharedDotTexture,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            starField = new THREE.Points(starGeo, starMat);
            spaceScene.add(starField);

            customStarGroup = new THREE.Group();
            for(let i = 0; i < 55; i++) {
                const randomRadius = 0.005 + Math.random() * 0.010; 
                const customStarGeo = new THREE.SphereGeometry(randomRadius, 4, 4);
                const customStarMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.98 });
                const starMesh = new THREE.Mesh(customStarGeo, customStarMat);
                
                starMesh.position.set(
                    (Math.random() - 0.5) * 16,
                    (Math.random() - 0.5) * 10,
                    -(Math.random() * 5)
                );
                starMesh.userData = { 
                    driftX: (Math.random() - 0.5) * 0.001, 
                    driftY: (Math.random() - 0.5) * 0.001,
                    baseOpacity: 0.98
                };
                customStarGroup.add(starMesh);
            }
            spaceScene.add(customStarGroup);

            spaceRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            spaceRenderer.setSize(window.innerWidth, window.innerHeight);
            spaceContainer.appendChild(spaceRenderer.domElement);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, orbContainer.offsetWidth / orbContainer.offsetHeight, 0.1, 100);
            camera.position.z = 2.4;

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            originalPositions = new Float32Array(PARTICLE_COUNT * 3);

            const coreColor = new THREE.Color(0xa2c4d6); 
            const edgeColor = new THREE.Color(0x4a6d82); 

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                
                let radius = 0.85 + (Math.random() * 0.04);

                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                originalPositions[i * 3] = x;
                originalPositions[i * 3 + 1] = y;
                originalPositions[i * 3 + 2] = z;

                const mixedColor = edgeColor.clone().lerp(coreColor, 0.4 + (Math.random() * 0.6));
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.020,
                map: sharedDotTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(orbContainer.offsetWidth, orbContainer.offsetHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            orbContainer.appendChild(renderer.domElement);

            orbWrapper.addEventListener('mouseenter', onOrbMouseEnter);
            orbWrapper.addEventListener('mouseleave', onOrbMouseLeave);
            
            orbContainer.addEventListener('click', (e) => {
                const rect = orbContainer.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const clickDistance = Math.hypot(e.clientX - centerX, e.clientY - centerY);
                
                const orbVisualRadius = rect.width * 0.36; 

                if (clickDistance <= orbVisualRadius) {
                    triggerWorkspaceActivation(e);
                }
            });

            animateLoop();
            renderPastChatsMenu();
        }

        function triggerWorkspaceActivation(e) {
            if (e) e.stopPropagation();
            homeSection.classList.add('workspace-active');
            spaceContainer.style.opacity = "0"; 
            setTimeout(() => { userInput.focus(); }, 850);
        }

        function onOrbMouseEnter() { targetSpeedMultiplier = 4.0; } 
        function onOrbMouseLeave() { targetSpeedMultiplier = 1.0; } 

        let clock = new THREE.Clock();

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            const elapsedTime = clock.getElapsedTime();
            
            if (starField) {
                starField.rotation.y = elapsedTime * 0.0004; 
            }

            if (customStarGroup) {
                customStarGroup.children.forEach(star => {
                    star.position.x += star.userData.driftX;
                    star.position.y += star.userData.driftY;
                    
                    if(Math.abs(star.position.x) > 9) star.position.x = -star.position.x;
                    if(Math.abs(star.position.y) > 6) star.position.y = -star.position.y;

                    const inCenterZoneX = Math.abs(star.position.x) < 3.2;
                    const inCenterZoneY = Math.abs(star.position.y) < 3.2;

                    if (inCenterZoneX && inCenterZoneY) {
                        star.material.opacity += (0.15 - star.material.opacity) * 0.1;
                    } else {
                        star.material.opacity += (star.userData.baseOpacity - star.material.opacity) * 0.1;
                    }
                });
            }

            if (elapsedTime > nextEventTime) {
                spawnCosmicEvent();
                nextEventTime = elapsedTime + 2.0 + Math.random() * 4.0; 
            }

            satelliteLights.forEach(light => {
                if(light.pulseType === 'blink') {
                    let isLit = Math.floor(elapsedTime * 4) % 2 === 0;
                    light.mesh.material.color.setHex(isLit ? light.baseColor : 0x000000);
                } else {
                    let pulseIntensity = (Math.sin(elapsedTime * 8) + 1) / 2;
                    light.mesh.material.color.setHex(pulseIntensity > 0.4 ? light.baseColor : 0x111111);
                }
            });

            for (let i = cosmicElements.length - 1; i >= 0; i--) {
                let obj = cosmicElements[i];
                obj.mesh.position.add(obj.velocity);
                
                if(obj.type === 'rock' || obj.type === 'satellite') {
                    obj.mesh.rotation.x += obj.rotSpeed;
                    obj.mesh.rotation.y += obj.rotSpeed * 0.7;
                }

                if (Math.abs(obj.mesh.position.x) > 11 || Math.abs(obj.mesh.position.y) > 8 || obj.mesh.position.z < -14 || obj.mesh.position.z > 6) {
                    spaceScene.remove(obj.mesh);
                    
                    if(obj.type === 'satellite') {
                        satelliteCount = Math.max(0, satelliteCount - 1);
                        satelliteLights = [];
                    }
                    if(obj.type === 'spacx_rocket') {
                        rocketCount = Math.max(0, rocketCount - 1);
                    }
                    
                    cosmicElements.splice(i, 1);
                }
            }

            currentSpeedMultiplier += (targetSpeedMultiplier - currentSpeedMultiplier) * 0.05;
            const currentSpeed = baseRotationSpeed * currentSpeedMultiplier;

            particleSystem.rotation.y += currentSpeed;
            particleSystem.rotation.x = elapsedTime * 0.0015; 

            const posAttr = particleSystem.geometry.attributes.position;
            const waveFrequency = 2.2;
            const waveAmplitude = 0.04; 

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let x = originalPositions[i * 3];
                let y = originalPositions[i * 3 + 1];
                let z = originalPositions[i * 3 + 2];

                const wave = Math.sin(x * waveFrequency + elapsedTime * 0.8) * Math.cos(y * waveFrequency + elapsedTime * 0.7) * Math.sin(z * waveFrequency + elapsedTime * 0.9);

                posAttr.array[i * 3] = x + x * wave * waveAmplitude;
                posAttr.array[i * 3 + 1] = y + y * wave * waveAmplitude;
                posAttr.array[i * 3 + 2] = z + z * wave * waveAmplitude;
            }
            posAttr.needsUpdate = true;

            // Render and spin mini velo instances
            for (let i = activeMiniOrbInstances.length - 1; i >= 0; i--) {
                const instance = activeMiniOrbInstances[i];
                if (!document.body.contains(instance.container)) {
                    instance.renderer.dispose();
                    activeMiniOrbInstances.splice(i, 1);
                    continue;
                }

                instance.currentSpeed += (instance.targetSpeed - instance.currentSpeed) * 0.06;

                instance.particles.rotation.y += instance.currentSpeed;
                instance.particles.rotation.x = elapsedTime * 0.002;

                const miniPosAttr = instance.particles.geometry.attributes.position;
                for (let k = 0; k < MINI_PARTICLE_COUNT; k++) {
                    let mx = instance.originals[k * 3];
                    let my = instance.originals[k * 3 + 1];
                    let mz = instance.originals[k * 3 + 2];

                    const wave = Math.sin(mx * waveFrequency + elapsedTime * 0.8) * Math.cos(my * waveFrequency + elapsedTime * 0.7) * Math.sin(mz * waveFrequency + elapsedTime * 0.9);
                    miniPosAttr.array[k * 3] = mx + mx * wave * waveAmplitude;
                    miniPosAttr.array[k * 3 + 1] = my + my * wave * waveAmplitude;
                    miniPosAttr.array[k * 3 + 2] = mz + mz * wave * waveAmplitude;
                }
                miniPosAttr.needsUpdate = true;
                instance.renderer.render(instance.scene, instance.camera);
            }

            spaceRenderer.render(spaceScene, spaceCamera);
            renderer.render(scene, camera);
        }

        function spawnCosmicEvent() {
            const roll = Math.random();
            let chosenType = 'rock';
            
            if (roll < 0.08) {
                chosenType = 'spacx_rocket';
            } else if (roll < 0.35) {
                chosenType = 'shooting_star'; 
            } else if (roll < 0.55) {
                chosenType = 'satellite';
            } else {
                chosenType = 'rock';
            }

            if (chosenType === 'spacx_rocket' && rocketCount >= 1) {
                chosenType = 'rock'; 
            }
            if (chosenType === 'satellite' && satelliteCount >= 2) {
                chosenType = 'rock'; 
            }
            
            let mesh;
            let velocity = new THREE.Vector3();
            let rotSpeed = (Math.random() - 0.5) * 0.015; 

            let startX = 0;
            let startY = 0;
            let startZ = -(1.0 + Math.random() * 2.0);

            const spawnWall = Math.floor(Math.random() * 4);
            if (spawnWall === 0) { 
                startX = -10.5;
                startY = (Math.random() - 0.5) * 11;
            } else if (spawnWall === 1) { 
                startX = 10.5;
                startY = (Math.random() - 0.5) * 11;
            } else if (spawnWall === 2) { 
                startX = (Math.random() - 0.5) * 18;
                startY = 7.5;
            } else { 
                startX = (Math.random() - 0.5) * 18;
                startY = -7.5;
            }

            const targetX = (Math.random() - 0.5) * 10;
            const targetY = (Math.random() - 0.5) * 6;
            
            const travelIntoDistance = Math.random() > 0.6;
            const targetZ = travelIntoDistance ? startZ - (5 + Math.random() * 5) : startZ; 

            const dir = new THREE.Vector3(targetX - startX, targetY - startY, targetZ - startZ).normalize();

            if (chosenType === 'spacx_rocket' || chosenType === 'satellite') {
                const clearanceRadius = 2.8; 
                let wouldOverlap = cosmicElements.some(existing => {
                    if (existing.type === 'spacx_rocket' || existing.type === 'satellite') {
                        let dist = Math.sqrt(
                            Math.pow(startX - existing.mesh.position.x, 2) + 
                            Math.pow(startY - existing.mesh.position.y, 2)
                        );
                        return dist < clearanceRadius;
                    }
                    return false;
                });
                
                if (wouldOverlap) {
                    chosenType = 'rock';
                }
            }
            
            const speedVariance = 0.8 + Math.random() * 0.4;
            
            let speed = 0.007 * speedVariance; 
            if (chosenType === 'satellite') speed = 0.012 * speedVariance; 
            if (chosenType === 'spacx_rocket') speed = 0.013 * speedVariance; 
            if (chosenType === 'shooting_star') speed = 0.095 * speedVariance; 
            
            velocity.copy(dir).multiplyScalar(speed);

            if (chosenType === 'rock') {
                const geom = createRealisticAsteroidGeometry();
                const shadesOfGray = [0x7a7d85, 0x8e929a, 0x5a5d63, 0x6e7278];
                const chosenGray = shadesOfGray[Math.floor(Math.random() * shadesOfGray.length)];
                
                const mat = new THREE.MeshBasicMaterial({ 
                    color: chosenGray,
                    map: rockTexture 
                });
                mesh = new THREE.Mesh(geom, mat);
                
                const scaleX = 0.75 + Math.random() * 0.45;
                const scaleY = 0.75 + Math.random() * 0.45;
                const scaleZ = 0.75 + Math.random() * 0.45;
                mesh.scale.set(scaleX, scaleY, scaleZ);

            } else if (chosenType === 'satellite') {
                satelliteCount++;
                mesh = createRealisticSatelliteMesh();
                mesh.scale.set(1.0, 1.0, 1.0);

            } else if (chosenType === 'spacx_rocket') {
                rocketCount++;
                const rocketData = createSpaceXRocketMesh();
                mesh = rocketData.group;
                mesh.scale.set(1.3, 1.3, 1.3);
                
                const targetPoint = new THREE.Vector3().copy(mesh.position).add(dir);
                mesh.lookAt(targetPoint);
                mesh.rotateX(Math.PI / 2);

            } else if (chosenType === 'shooting_star') {
                mesh = createShootingStarMesh();
                const targetPoint = new THREE.Vector3().copy(mesh.position).add(dir);
                mesh.lookAt(targetPoint);
                mesh.rotateX(-Math.PI / 2);
            }

            mesh.position.set(startX, startY, startZ);
            spaceScene.add(mesh);
            cosmicElements.push({ type: chosenType, mesh, velocity, rotSpeed, initialZ: startZ });
        }

        function brainstormChatTitle(firstMessage) {
            if (!firstMessage) return "New Conversation";
            const clean = firstMessage.trim().toLowerCase();

            if (/(temp|weather|forecast|cold|hot|rain|sunny)/i.test(clean)) {
                const locationMatch = firstMessage.match(/(in|at|for)\s+([A-Za-z\s]{2,20})/i);
                return locationMatch ? `${locationMatch[2].trim()} Weather` : "Weather Intelligence";
            }
            if (/(code|js|html|css|python|bug|function|react|fix)/i.test(clean)) {
                return "Software Engineering";
            }
            if (/(write|story|poem|essay|script|creative)/i.test(clean)) {
                return "Creative Content";
            }

            const words = firstMessage.split(/\s+/).slice(0, 3).join(" ");
            return words.length > 22 ? words.substring(0, 20) + "..." : words;
        }

        function archiveCurrentChat() {
            if (currentActiveChat.length > 0) {
                const history = JSON.parse(localStorage.getItem('velo_history')) || [];
                const initialUserPrompt = currentActiveChat.find(m => m.role === 'user')?.text || "";
                const adaptiveTitle = brainstormChatTitle(initialUserPrompt);

                history.unshift({ id: Date.now(), title: adaptiveTitle, data: currentActiveChat });
                localStorage.setItem('velo_history', JSON.stringify(history));
                renderPastChatsMenu();
            }

            currentActiveChat = [];
            chatContainer.innerHTML = "";
            chatContainer.classList.remove('has-fade');
        }

        function archiveAndNewChat() {
            archiveCurrentChat();
            userInput.focus();
        }

        function goHomeAndSave() {
            archiveCurrentChat();
            homeSection.classList.remove('workspace-active');
            spaceContainer.style.opacity = "1";
        }

        function toggleHistoryPanel() {
            historyPanel.classList.toggle('open');
        }

        function renderPastChatsMenu() {
            const history = JSON.parse(localStorage.getItem('velo_history')) || [];
            historyList.innerHTML = "";
            
            if (history.length === 0) {
                historyList.innerHTML = `<div style="font-size:0.8rem;color:rgba(255,255,255,0.2);padding:10px;">No saved histories</div>`;
                return;
            }

            history.forEach(session => {
                const item = document.createElement('div');
                item.classList.add('history-item');
                item.innerText = session.title;
                item.onclick = () => { loadSavedSession(session.data); };
                historyList.appendChild(item);
            });
        }

        function loadSavedSession(chatData) {
            homeSection.classList.add('workspace-active');
            spaceContainer.style.opacity = "0"; 
            chatContainer.innerHTML = "";
            currentActiveChat = chatData;
            
            chatData.forEach(msg => { appendBubbleToUI(msg.role, msg.text); });
            toggleHistoryPanel();
        }

        initEnvironment();
        initVeloNav(null);

        window.addEventListener('resize', () => {
            if (renderer && camera && spaceRenderer && spaceCamera) {
                camera.aspect = orbContainer.offsetWidth / orbContainer.offsetHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(orbContainer.offsetWidth, orbContainer.offsetHeight);

                spaceCamera.aspect = window.innerWidth / window.innerHeight;
                spaceCamera.updateProjectionMatrix();
                spaceRenderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        chatContainer.addEventListener('scroll', () => {
            if (chatContainer.scrollTop > 10) {
                chatContainer.classList.add('has-fade');
            } else {
                chatContainer.classList.remove('has-fade');
            }
        });

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && userInput.value.trim() !== "") {
                handleUserMessage(userInput.value);
                userInput.value = "";
            }
        });

        async function handleUserMessage(message) {
            appendBubble('user', message);

            const veloBubble = appendBubbleToUI('velo', "");
            veloBubble.innerHTML = `<div class="mini-orb-wrapper"></div>`;
            const miniContainer = veloBubble.querySelector('.mini-orb-wrapper');
            
            // Instantiates 2,000 particle Mini Velo inside bubble
            const miniOrbInstance = create2000BeadMiniVelo(miniContainer);
            
            // Spin rapidly when transitioning to its thinking state
            miniOrbInstance.targetSpeed = 0.024; 

            try {
                const history = currentActiveChat
                    .filter(m => m.text)
                    .slice(-20)
                    .map(m => ({ role: m.role === 'velo' ? 'model' : 'user', text: m.text }));

                const response = await fetch(SUPABASE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history })
                });

                if (!response.ok) throw new Error("API Offline");

                const data = await response.json();

                if (data.errorType === 'rate_limit') {
                    miniOrbInstance.targetSpeed = 0.003; // Return to soft ambient speed
                    veloBubble.innerHTML = `<span style="color: #ff7676; font-weight: 500;">Velo is catching its breath.</span><br><span style="font-size: 0.85rem; color: rgba(255,255,255,0.5);">Free tier API limits reached. Please pause for 10-15 seconds before trying your prompt again.</span>`;
                    currentActiveChat.push({ role: 'velo', text: "Velo Rate Limit Intercept Event." });
                    return;
                }

                if (data.errorType === 'api_error') {
                    miniOrbInstance.targetSpeed = 0.003;
                    veloBubble.innerHTML = `<span style="color: #ff7676; font-weight: 500;">Velo hit an error.</span><br><span style="font-size: 0.85rem; color: rgba(255,255,255,0.5);">${data.reply}</span>`;
                    currentActiveChat.push({ role: 'velo', text: data.reply });
                    return;
                }

                await streamTextToBubble(veloBubble, data.reply, miniOrbInstance);
                currentActiveChat.push({ role: 'velo', text: data.reply });

            } catch (error) {
                miniOrbInstance.targetSpeed = 0.003;
                veloBubble.innerText = "Forgive me, I encountered an error connecting to my brain.";
                console.error(error);
            }
        }

        function enhanceCodeBlocks(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.dataset.enhanced) return;
                pre.dataset.enhanced = 'true';

                const codeEl = pre.querySelector('code');
                if (codeEl && window.hljs) {
                    hljs.highlightElement(codeEl);
                }

                const copyBtn = document.createElement('button');
                copyBtn.className = 'code-copy-btn';
                copyBtn.type = 'button';
                copyBtn.textContent = 'Copy';
                copyBtn.onclick = () => {
                    const codeText = codeEl ? codeEl.innerText : pre.innerText;
                    navigator.clipboard.writeText(codeText).then(() => {
                        copyBtn.textContent = 'Copied!';
                        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
                    }).catch(() => {
                        copyBtn.textContent = 'Failed';
                        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
                    });
                };
                pre.appendChild(copyBtn);
            });
        }

        function streamTextToBubble(element, fullText, miniOrbInstance) {
            return new Promise((resolve) => {
                let index = 0;
                const words = fullText.split(/(\s+)/);

                function typeNextWord() {
                    if (index < words.length) {
                        const partialString = words.slice(0, index + 1).join("");
                        element.innerHTML = marked.parse(partialString);
                        index++;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                        setTimeout(typeNextWord, Math.random() * 12 + 6);
                    } else {
                        // Return spin speed to slow glide once streaming finishes
                        if(miniOrbInstance) miniOrbInstance.targetSpeed = 0.003;
                        enhanceCodeBlocks(element);
                        resolve();
                    }
                }
                typeNextWord();
            });
        }

        function appendBubble(role, text) {
            currentActiveChat.push({ role, text });
            return appendBubbleToUI(role, text);
        }

        function appendBubbleToUI(role, text) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble', role);
            
            if (role === 'velo' && text !== "") {
                if (text.includes("Quota exceeded") || text.includes("Google API Error")) {
                    bubble.innerHTML = `<span style="color: #ff7676; font-weight: 500;">Velo Rate Limit Intercept Event.</span>`;
                } else {
                    bubble.innerHTML = marked.parse(text);
                    enhanceCodeBlocks(bubble);
                }
            } else {
                bubble.innerText = text;
            }
            
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }
    </script>
